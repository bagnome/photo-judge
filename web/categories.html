<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Judge — Categories</title>
<style>
 body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#1b1d21;color:#e8e8e8}
 header{background:#111;padding:10px 16px;font-weight:600;font-size:15px;display:flex;gap:14px;align-items:center}
 header a{color:#7fa9f0;text-decoration:none;font-weight:500;font-size:13px}
 .bar{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #333}
 label{color:#9aa0a6;font-size:13px}
 select,input,button{font-size:14px;padding:6px 10px;background:#2a2d33;color:#eee;border:1px solid #444;border-radius:5px;box-sizing:border-box;max-width:100%}
 button{cursor:pointer}
 button:hover{background:#363a42}
 button:disabled{opacity:.4;cursor:not-allowed}
 button.danger{background:#a83232;border-color:#a83232}
 button.danger:hover:not(:disabled){background:#c23b3b}
 .note{color:#8a9099;font-size:13px;max-width:520px}
 #guide{display:none;margin:16px;padding:22px 26px;border:1px solid #3a3e45;border-radius:8px;background:#23262c;color:#c9ccd1;max-width:660px;line-height:1.55}
 #guide.show{display:block}
 #guide h2{margin:0 0 10px;font-size:16px;color:#e8e8e8}
 #guide .k{color:#e8e8e8;font-weight:600}
 #manager{display:none;padding:8px 16px 24px}
 #manager.show{display:block}
 .addrow{display:flex;gap:8px;align-items:center;margin:8px 0 16px;flex-wrap:wrap}
 .panes{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
 .pane{flex:1 1 280px;min-width:260px;background:#23262c;border:1px solid #3a3e45;border-radius:8px;display:flex;flex-direction:column;max-height:62vh}
 .pane h3{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid #33373e;display:flex;justify-content:space-between}
 .pane h3 .cnt{color:#777;font-weight:400}
 .list{flex:1 1 auto;overflow:auto;padding:6px;min-height:80px}
 .item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;cursor:pointer;user-select:none}
 .item:hover{background:#2a2e35}
 .item.sel{background:#2d6cdf;color:#fff}
 .item .num{color:#9aa0a6;font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
 .item.sel .num{color:#dce7ff}
 .item .nm{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .item .tag{font-size:11px;color:#9aa0a6;background:#1b1d21;border:1px solid #3a3e45;border-radius:10px;padding:0 7px}
 .item.sel .tag{color:#dce7ff;border-color:#5b8de8}
 .empty{color:#777;font-size:13px;padding:10px}
 .actions{display:flex;gap:6px;padding:10px;border-top:1px solid #33373e;flex-wrap:wrap}
 #toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:1000}
 .toast{background:#2e7d46;color:#fff;padding:10px 14px;border-radius:6px;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:360px}
 .toast.show{opacity:1;transform:none}
 .toast.del{background:#a83232}
 @media (max-width:760px){
   header{flex-wrap:wrap;gap:10px}
   select,input,button{font-size:16px;padding:9px 12px} /* 16px avoids iOS zoom-on-focus */
   .panes{flex-direction:column;gap:12px}
   .pane{max-height:none;width:100%}
   .list{max-height:46vh}
   .item{padding:11px 12px} /* bigger tap target */
   .actions button{flex:1 1 auto;min-height:44px}
 }
</style>
</head>
<body>
<header>Photo Judge — Categories</header>
<div class="bar">
  <label>Session</label><select id="session"></select>
  <span class="note">Categories are per session. The <b>Active</b> order sets the console dropdowns and the score-sheet PDF. A new session inherits the latest session's setup.</span>
</div>

<div id="guide"></div>

<div id="manager">
  <div class="addrow">
    <label>Add category</label>
    <input id="newcat" type="text" placeholder="e.g. Nature" maxlength="100">
    <button id="addbtn">Add to Active</button>
  </div>
  <div class="panes">
    <div class="pane">
      <h3>Inactive <span class="cnt" id="cnt-inactive"></span></h3>
      <div class="list" id="list-inactive"></div>
      <div class="actions">
        <button id="actActivate" disabled>Activate →</button>
        <button id="actDelete" class="danger" disabled>Delete</button>
      </div>
    </div>
    <div class="pane">
      <h3>Active <span class="cnt" id="cnt-active"></span></h3>
      <div class="list" id="list-active"></div>
      <div class="actions">
        <button id="actUp" disabled>↑ Up</button>
        <button id="actDown" disabled>↓ Down</button>
        <button id="actDeactivate" disabled>← Deactivate</button>
      </div>
    </div>
  </div>
</div>
<div id="toasts"></div>

<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const post = (u,b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)});
let sessions = [];
let detail = {active:[], inactive:[], used:[]};
let selActive = null, selInactive = null;
let loadedFor = null;            // session id whose detail is currently shown

const sid = () => $('session').value;

function toast(msg, kind){
 const t=document.createElement('div'); t.className='toast'+(kind?' '+kind:''); t.textContent=msg;
 $('toasts').appendChild(t); requestAnimationFrame(()=>t.classList.add('show'));
 setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),250);},3200);
}

function applyState(st){
 sessions = st.sessions || [];
 const sel=$('session'), cur=sel.value;
 sel.innerHTML='';
 sessions.forEach(s => { const o=document.createElement('option'); o.value=s.id; o.textContent=s.date+'  (#'+s.id+')'; sel.appendChild(o); });
 if(cur && sessions.some(s=>s.id===cur)) sel.value=cur;
 updateView();
 const cs = sid();
 if(cs && cs !== loadedFor) loadDetail();        // first session / selection arrived via SSE
 else if(!cs) loadedFor = null;
}

function updateView(){
 const guide=$('guide'), mgr=$('manager');
 if(sessions.length === 0){
   mgr.classList.remove('show');
   guide.innerHTML = '<h2>Create a session first</h2>'
     + 'Categories are managed <span class="k">per session</span>. Create a session on the '
     + '<a href="/" style="color:#7fa9f0">Console</a> (or the Upload page), then come back here to set it up.';
   guide.classList.add('show');
   return;
 }
 if(!sid()){
   mgr.classList.remove('show');
   guide.innerHTML = '<h2>Select a session</h2>Pick a session from the menu above to manage its categories.';
   guide.classList.add('show');
   return;
 }
 guide.classList.remove('show');
 mgr.classList.add('show');
}

async function loadDetail(){
 if(!sid()){ loadedFor=null; updateView(); return; }
 loadedFor = sid();
 selActive = selInactive = null;
 const r = await fetch('/api/session/categories?session='+enc(sid()));
 if(!r.ok){ toast('Could not load categories: '+(await r.text()), 'del'); return; }
 detail = await r.json();
 render();
}

function render(){
 updateView();
 if(!sid()) return;
 const active = detail.active || [];
 const inactive = (detail.inactive || []).slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
 const used = new Set((detail.used || []).map(x=>x.toLowerCase()));

 const la = $('list-active'); la.innerHTML='';
 $('cnt-active').textContent='('+active.length+')';
 if(active.length===0) la.innerHTML='<div class="empty">No active categories. Activate one from the left, or add a new one.</div>';
 active.forEach((c,i) => {
   const d=document.createElement('div'); d.className='item'+(c===selActive?' sel':'');
   d.onclick=()=>{selActive=c; selInactive=null; render();};
   const num=document.createElement('span'); num.className='num'; num.textContent=(i+1);
   const nm=document.createElement('span'); nm.className='nm'; nm.textContent=c;
   d.append(num, nm);
   if(used.has(c.toLowerCase())){ const t=document.createElement('span'); t.className='tag'; t.textContent='photos'; d.appendChild(t); }
   la.appendChild(d);
 });

 const li=$('list-inactive'); li.innerHTML='';
 $('cnt-inactive').textContent='('+inactive.length+')';
 if(inactive.length===0) li.innerHTML='<div class="empty">Nothing inactive.</div>';
 inactive.forEach(c => {
   const d=document.createElement('div'); d.className='item'+(c===selInactive?' sel':'');
   d.onclick=()=>{selInactive=c; selActive=null; render();};
   const nm=document.createElement('span'); nm.className='nm'; nm.textContent=c;
   d.append(nm);
   if(used.has(c.toLowerCase())){ const t=document.createElement('span'); t.className='tag'; t.textContent='photos'; d.appendChild(t); }
   li.appendChild(d);
 });

 const aIdx = active.indexOf(selActive);
 $('actUp').disabled = !(selActive && aIdx>0);
 $('actDown').disabled = !(selActive && aIdx>=0 && aIdx<active.length-1);
 $('actDeactivate').disabled = !selActive;
 $('actActivate').disabled = !selInactive;
 $('actDelete').disabled = !(selInactive && !used.has((selInactive||'').toLowerCase()));
}

async function mutate(url, body, okMsg, kind){
 const r = await post(url, body);
 if(!r.ok){ toast((await r.text())||'Action failed', 'del'); return false; }
 detail = await r.json();
 render();
 if(okMsg) toast(okMsg, kind);
 return true;
}

$('addbtn').onclick = async () => {
 const name = $('newcat').value.trim();
 if(!name) return;
 if(await mutate('/api/session/category/add', {session:sid(), name}, 'Added “'+name+'” to Active')){ $('newcat').value=''; selActive=name; render(); }
};
$('newcat').addEventListener('keydown', e=>{ if(e.key==='Enter') $('addbtn').click(); });

$('actActivate').onclick = async () => { const n=selInactive; if(!n) return;
 if(await mutate('/api/session/category/activate',{session:sid(),name:n},'Activated “'+n+'”')){ selActive=n; selInactive=null; render(); } };
$('actDeactivate').onclick = async () => { const n=selActive; if(!n) return;
 if(await mutate('/api/session/category/deactivate',{session:sid(),name:n},'Deactivated “'+n+'”')){ selInactive=n; selActive=null; render(); } };
$('actDelete').onclick = async () => { const n=selInactive; if(!n) return;
 if(!await pjConfirm('Delete “'+n+'” from this session?', {title:'Delete category', okLabel:'Delete', danger:true})) return;
 if(await mutate('/api/session/category/delete',{session:sid(),name:n},'Deleted “'+n+'”','del')){ selInactive=null; render(); } };

function moveSel(dir){
 const active=(detail.active||[]).slice();
 const i=active.indexOf(selActive), j=i+dir;
 if(i<0 || j<0 || j>=active.length) return;
 [active[i], active[j]]=[active[j], active[i]];
 mutate('/api/session/category/reorder', {session:sid(), order:active});  // selActive name preserved
}
$('actUp').onclick = () => moveSel(-1);
$('actDown').onclick = () => moveSel(1);

$('session').addEventListener('change', loadDetail);

const es = new EventSource('/api/events?role=console');
es.onmessage = e => applyState(JSON.parse(e.data));
</script>
<script src="/modal.js"></script>
<script src="/nav.js"></script>
</body>
</html>
