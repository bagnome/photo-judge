<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Photo Judge — Scoring</title>
<style>
 body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#1b1d21;color:#e8e8e8}
 header{background:#111;padding:10px 16px;font-weight:600;font-size:15px;display:flex;gap:14px;align-items:center}
 header a{color:#7fa9f0;text-decoration:none;font-weight:500;font-size:13px}
 .bar{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #333}
 label{color:#9aa0a6;font-size:13px}
 select,input,button{font-size:14px;padding:6px 10px;background:#2a2d33;color:#eee;border:1px solid #444;border-radius:5px}
 button{cursor:pointer}
 button:hover{background:#363a42}
 button.primary{background:#2d6cdf;border-color:#2d6cdf}
 button.primary:hover{background:#3b78e6}
 .slate{color:#9aa0a6;font-size:13px}
 .slate b{color:#cdd}
 .sep{color:#444}
 #empty{display:none;margin:40px 16px;padding:26px 30px;border:1px solid #3a3e45;border-radius:8px;background:#23262c;color:#c9ccd1;max-width:640px;line-height:1.55}
 #empty.show{display:block}
 #empty h2{margin:0 0 10px;font-size:16px;color:#e8e8e8}
 main{display:none;padding:16px;gap:20px;align-items:flex-start}
 main.show{display:flex}
 #stagewrap{flex:1 1 auto;min-width:0}
 #stage{background:#000;border:1px solid #333;border-radius:8px;height:62vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
 #stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
 #stage .none{color:#555;font-size:14px}
 #nav{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
 #counter{font-variant-numeric:tabular-nums;color:#cdd;font-size:15px;min-width:120px;text-align:center}
 #fn{margin-top:8px;text-align:center;color:#8a9099;font-size:12px;word-break:break-all}
 .panel{flex:0 0 320px;background:#23262c;border:1px solid #3a3e45;border-radius:8px;padding:18px}
 .panel h3{margin:0 0 14px;font-size:15px}
 .field{margin-bottom:16px}
 .field .lbl{color:#9aa0a6;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
 .field .val{font-size:15px;color:#e8e8e8;word-break:break-word}
 .field .val.muted{color:#777}
 #score{width:100%;box-sizing:border-box;font-size:22px;text-align:center;padding:10px;background:#2a2d33;border:1px solid #444;border-radius:6px;color:#fff}
 #score:focus{border-color:#2d6cdf;outline:none}
 #score.set{border-color:#2e7d46}
 #scorehint{color:#777;font-size:12px;margin-top:6px}
 #op{padding:12px 14px;border-radius:7px;background:#22252b;border:1px solid #3a3e45;font-size:14px;line-height:1.4}
 #op .opwhat{font-weight:600;color:#cdd}
 #op.match{background:#16331f;border-color:#2e7d46}
 #op.match .opwhat{color:#79d28e}
 #op .same{display:none;margin-top:6px;color:#79d28e;font-weight:600;font-size:13px}
 #op.match .same{display:block}
 #gotoop{margin-top:10px;width:100%}
 #gotoop:disabled{opacity:.4;cursor:default}
 #toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:1000}
 .toast{background:#2e7d46;color:#fff;padding:10px 14px;border-radius:6px;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:360px}
 .toast.show{opacity:1;transform:none}
 .toast.del{background:#a83232}
</style>
</head>
<body>
<header>Photo Judge — Scoring <a href="/">← Console</a></header>
<div class="bar">
  <label>Follow screen</label><select id="screen"></select>
  <span class="sep">|</span>
  <span class="slate" id="slate"></span>
</div>

<div id="empty"></div>

<main id="main">
  <div id="stagewrap">
    <div id="stage"><div class="none">No photo</div></div>
    <div id="nav">
      <button id="prev">◀ Prev</button>
      <span id="counter">—</span>
      <button id="next">Next ▶</button>
    </div>
    <div id="fn"></div>
  </div>
  <div class="panel">
    <h3>Score this photo</h3>
    <div id="op"><span class="opwhat" id="opwhat">—</span><div class="same">● You're viewing the operator's current photo</div></div>
    <button id="gotoop" class="primary">Jump to operator's photo</button>
    <div class="field" style="margin-top:16px">
      <div class="lbl">Photographer</div>
      <div class="val muted" id="ph">—</div>
    </div>
    <div class="field">
      <div class="lbl">Score</div>
      <input id="score" type="text" inputmode="decimal" placeholder="—" autocomplete="off">
      <div id="scorehint">Press Enter to save · saved per photo.</div>
    </div>
  </div>
</main>
<div id="toasts"></div>

<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const post = (u,b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)});

let screens = [];          // from the console stream
let curName = null;        // which screen we're following
let slateKey = '';         // session|category|orientation we last loaded photos for
let files = [], names = {}, scores = {};
let idx = 0;               // 1-based judge cursor into files (0 = nothing)

function toast(msg, kind){
 const t = document.createElement('div');
 t.className = 'toast' + (kind ? ' '+kind : '');
 t.textContent = msg;
 $('toasts').appendChild(t);
 requestAnimationFrame(() => t.classList.add('show'));
 setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 3000);
}

function curScreen(){ return screens.find(s => s.name === curName) || null; }

// applyState refreshes the screen list and, if the followed screen changed what it
// has loaded, reloads the photo set. The operator indicator always re-renders so it
// tracks the operator live.
function applyState(st){
 screens = st.screens || [];
 const sel = $('screen'), prev = sel.value;
 sel.innerHTML = '';
 screens.forEach(s => { const o=document.createElement('option'); o.value=s.name; o.textContent=s.name; sel.appendChild(o); });
 if(curName && screens.some(s => s.name === curName)) sel.value = curName;
 else if(prev && screens.some(s => s.name === prev)){ sel.value = prev; curName = prev; }
 else if(screens.length){ sel.value = screens[0].name; curName = screens[0].name; }
 else curName = null;

 syncToScreen();
}

// syncToScreen loads the photo list for the followed screen's slate when it changes,
// then re-renders. Cheap to call on every console push.
async function syncToScreen(){
 const sc = curScreen();
 const main = $('main'), empty = $('empty');
 if(!sc || !sc.category){
   main.classList.remove('show');
   empty.innerHTML = !sc
     ? '<h2>No screen to follow</h2>Create a screen on the console and load a category onto it, then come back here to score along.'
     : '<h2>Nothing loaded on “'+sc.name+'” yet</h2>The operator hasn\'t loaded a category onto this screen. Once they do — or pick a different screen above — its photos appear here for scoring.';
   empty.classList.add('show');
   $('slate').innerHTML = sc ? ('Screen <b>'+esc(sc.name)+'</b> — nothing loaded') : '';
   return;
 }
 $('slate').innerHTML = 'Session <b>#'+esc(sc.sessionId)+'</b> · <b>'+esc(sc.category)+'</b> · <b>'+esc(sc.orientation)+'</b>';
 const key = sc.sessionId+'|'+sc.category+'|'+sc.orientation;
 if(key !== slateKey){
   slateKey = key;
   const r = await fetch('/api/photos?session='+enc(sc.sessionId)+'&category='+enc(sc.category)+'&orientation='+enc(sc.orientation));
   const j = await r.json();
   files = j.files || []; names = j.names || {}; scores = j.scores || {};
   // Land on the operator's current photo if they're on one, else the first photo.
   idx = (sc.position >= 1 && sc.position <= files.length) ? sc.position : (files.length ? 1 : 0);
 }
 empty.classList.remove('show');
 main.classList.add('show');
 render();
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
 const sc = curScreen();
 const stage = $('stage');
 if(!files.length || idx < 1){
   stage.innerHTML = '<div class="none">No photos in this category yet.</div>';
   $('counter').textContent = '0 / 0';
   $('fn').textContent = '';
   $('ph').textContent = '—'; $('ph').className = 'val muted';
   $('score').value = ''; $('score').classList.remove('set'); $('score').disabled = true;
   renderOp();
   return;
 }
 if(idx > files.length) idx = files.length;
 const fn = files[idx-1];
 stage.innerHTML = '';
 const img = document.createElement('img');
 img.src = '/api/photo?session='+enc(sc.sessionId)+'&category='+enc(sc.category)+'&orientation='+enc(sc.orientation)+'&file='+enc(fn);
 stage.appendChild(img);
 $('counter').textContent = idx + ' / ' + files.length;
 $('fn').textContent = fn;
 const pn = names[fn] || '';
 $('ph').textContent = pn || '—';
 $('ph').className = 'val' + (pn ? '' : ' muted');
 const sIn = $('score');
 if(document.activeElement !== sIn){       // don't clobber what the judge is typing
   sIn.value = scores[fn] || '';
   sIn.classList.toggle('set', !!scores[fn]);
 }
 sIn.disabled = false;
 renderOp();
}

// renderOp describes where the operator is on the followed screen and highlights
// when the judge is looking at that same photo.
function renderOp(){
 const sc = curScreen();
 const op = $('op'), what = $('opwhat'), goto = $('gotoop');
 let onPhoto = 0; // operator's current photo number, 0 if not on a photo
 let txt;
 if(!sc || !sc.category){ txt = 'Screen idle'; }
 else if(sc.blackout){ txt = 'Operator: screen blacked out'; }
 else if(sc.position <= 0){ txt = 'Operator: title card'; }
 else if(sc.position > sc.count){ txt = 'Operator: end of category'; }
 else { onPhoto = sc.position; txt = 'Operator showing: photo ' + sc.position + ' / ' + sc.count; }
 what.textContent = txt;
 const match = onPhoto > 0 && onPhoto === idx;
 op.classList.toggle('match', match);
 goto.disabled = onPhoto < 1;
 goto.dataset.target = onPhoto;
}

function go(n){
 if(!files.length) return;
 idx = Math.min(Math.max(1, n), files.length);
 render();
}

async function saveScore(){
 const sc = curScreen();
 if(!sc || idx < 1) return;
 const fn = files[idx-1];
 const val = $('score').value.trim();
 const r = await post('/api/photo/score', {session:sc.sessionId, category:sc.category, orientation:sc.orientation, file:fn, score:val});
 if(!r.ok){ toast('Could not save score: '+(await r.text()), 'del'); return; }
 if(val) scores[fn] = val; else delete scores[fn];
 $('score').classList.toggle('set', !!val);
 toast(val ? ('Score '+val+' saved for photo '+idx) : ('Score cleared for photo '+idx));
}

$('screen').addEventListener('change', () => { curName = $('screen').value; slateKey=''; syncToScreen(); });
$('prev').onclick = () => go(idx-1);
$('next').onclick = () => go(idx+1);
$('gotoop').onclick = () => { const t = parseInt($('gotoop').dataset.target,10); if(t>=1) go(t); };
$('score').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('score').blur(); } });
$('score').addEventListener('change', saveScore);
document.addEventListener('keydown', e => {
 if(e.target === $('score')) return;            // typing a score, not navigating
 if(e.key === 'ArrowLeft') go(idx-1);
 else if(e.key === 'ArrowRight') go(idx+1);
});

const es = new EventSource('/api/events?role=console');
es.onmessage = e => applyState(JSON.parse(e.data));
</script>
</body>
</html>
