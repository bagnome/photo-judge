<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Judge — Console</title>
<style>
 body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#1b1d21;color:#e8e8e8}
 header{background:#111;padding:10px 16px;font-weight:600;font-size:15px}
 .bar{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #333}
 label{color:#9aa0a6;font-size:13px}
 select,input,button{font-size:14px;padding:6px 10px;background:#2a2d33;color:#eee;border:1px solid #444;border-radius:5px;box-sizing:border-box;max-width:100%}
 button{cursor:pointer}
 button:hover{background:#363a42}
 button:disabled{opacity:.4;cursor:not-allowed}
 button:disabled:hover{background:#2a2d33}
 button.primary:disabled:hover{background:#2d6cdf}
 button.primary{background:#2d6cdf;border-color:#2d6cdf}
 button.primary:hover{background:#3b78e6}
 button.danger{background:#a83232;border-color:#a83232}
 button.danger:hover{background:#c23b3b}
 .spacer{flex:1 1 auto}
 #toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:1000}
 .toast{background:#2e7d46;color:#fff;padding:10px 14px;border-radius:6px;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:360px}
 .toast.show{opacity:1;transform:none}
 .toast.edit{background:#2d6cdf}
 .toast.del{background:#a83232}
 #monpick{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:2000}
 #monpick.show{display:flex}
 .monbox{background:#23262c;border:1px solid #3a3e45;border-radius:8px;padding:18px 20px;min-width:320px}
 .monbox h3{margin:0 0 12px;font-size:15px;font-weight:600}
 .monbtn{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
 .moncancel{color:#9aa0a6}
 /* Selected session's description, shown between the action bar and the screens table. */
 .sessdesc{display:none;padding:9px 16px;background:#202329;border-bottom:1px solid #333;color:#c9ccd1;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
 .sessdesc.show{display:block}
 /* Judging-session control strip (Start/Stop + how many judges have joined). */
 .judgebar{display:none;padding:10px 16px;background:#1f2630;border-bottom:1px solid #33414f;flex-wrap:wrap;align-items:center;gap:12px}
 .judgebar.show{display:flex}
 .judgebar.live{background:#16301f;border-bottom-color:#2f6b41}
 .jb-state{font-size:14px;font-weight:600}
 .jb-state.on{color:#4caf50}
 .jb-state.off{color:#e0b052}
 .jb-joined{font-size:13px;color:#9aa0a6}
 .jb-joined b{color:#e8e8e8}
 .jb-names{flex-basis:100%;font-size:13px;color:#9aa0a6;line-height:1.5}
 .jb-tag{display:inline-block;background:#2a2d33;border:1px solid #444;border-radius:12px;padding:1px 9px;margin:2px 4px 0 0;font-size:12.5px;color:#cfd3d8}
 .jb-tag.alt{border-color:#5a6b3a;color:#bcd29a}
 .jb-spacer{flex:1 1 auto}
 #jstartmodal .rules{margin:0 0 14px;padding:0;list-style:none;font-size:13.5px;color:#c9ccd1;line-height:1.7}
 #jstartmodal .rules b{color:#e8e8e8;font-weight:600}
 #jstartmodal .warn{color:#e0b052;font-size:13px;margin:0 0 12px}
 /* Console presentation panel: the guided current photo + Prev/Next, with inline scoring
    (Score Keeper) or the judge board (Judge mode), shown below the screens table. */
 #preview{display:none;margin:14px 16px;background:#23262c;border:1px solid #3a3e45;border-radius:8px;overflow:hidden}
 #preview.show{display:block}
 .pv-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #33373e;flex-wrap:wrap}
 .pv-info{font-size:14px;color:#cdd}
 .pv-info b{color:#e8e8e8}
 .pv-paused{color:#e0b052;font-weight:600}
 .pv-body{display:flex;gap:16px;padding:14px;flex-wrap:wrap}
 .pv-stage{flex:1 1 360px;min-width:280px;min-height:240px;background:#15171a;border:1px solid #2c2f35;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center}
 .pv-stage img{max-width:100%;max-height:46vh;border-radius:4px;background:#000}
 .pv-meta{margin-top:8px;font-size:13px;color:#9aa0a6}
 .pv-meta b{color:#e8e8e8}
 .pv-pos{margin-left:6px;font-variant-numeric:tabular-nums}
 .pv-card .pv-cat{font-size:22px;font-weight:600;color:#e8e8e8}
 .pv-card .pv-sub{margin-top:6px;color:#9aa0a6;font-size:14px}
 .pv-side{flex:1 1 240px;min-width:220px}
 .pv-lbl{color:#9aa0a6;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
 #pv-scoreinput{width:100%;box-sizing:border-box;font-size:22px;text-align:center;padding:10px;background:#2a2d33;border:1px solid #444;border-radius:6px;color:#fff}
 #pv-scoreinput:focus{border-color:#2d6cdf;outline:none}
 #pv-scoreinput.set{border-color:#2e7d46}
 #pv-scoreinput:disabled{opacity:.5}
 .winflag{background:#b8860b;color:#fff;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:1px}
 .pv-hint{color:#777;font-size:12px;margin-top:6px}
 #pv-board .jrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #2c2f35;font-size:14px}
 #pv-board .jname{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #pv-board .jtag{font-size:11px;color:#9aa0a6;background:#1b1d21;border:1px solid #3a3e45;border-radius:9px;padding:0 6px}
 #pv-board .jscore{font-variant-numeric:tabular-nums;font-weight:600;min-width:54px;text-align:right}
 #pv-board .jscore.none{color:#777;font-weight:400}
 #pv-board .jre{font-size:12px;padding:5px 9px;background:#2a2d33;color:#eee;border:1px solid #444;border-radius:5px;cursor:pointer}
 #pv-board .jre:hover{background:#363a42}
 #pv-board .combined{margin-top:14px;font-size:15px;color:#cdd}
 #pv-board .combined b{font-size:22px;font-variant-numeric:tabular-nums;color:#fff}
 #pv-board .done{color:#79d28e;font-weight:600}
 #pv-board .pending{color:#ffd27a;font-weight:600}
 #pv-board .rescoreall{margin-top:14px;width:100%;font-size:13px;padding:8px;background:#2a2d33;color:#eee;border:1px solid #444;border-radius:6px;cursor:pointer}
 /* Create / edit session modal. */
 #sessmodal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:2000}
 #sessmodal.show{display:flex}
 #sessmodal .card{background:#23262c;border:1px solid #3a3e45;border-radius:8px;padding:20px;width:min(460px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.55)}
 #sessmodal h3{margin:0 0 14px;font-size:16px}
 #sessmodal .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
 #sessmodal .fld label{font-size:13px;color:#9aa0a6}
 #sessmodal textarea{font-size:14px;padding:8px 10px;background:#2a2d33;color:#eee;border:1px solid #444;border-radius:5px;width:100%;box-sizing:border-box;resize:vertical;min-height:64px;font-family:inherit}
 #sessmodal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
 table{width:100%;border-collapse:collapse}
 th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #2c2f35;font-size:14px;vertical-align:middle}
 th{color:#9aa0a6;font-weight:500}
 .status{font-variant-numeric:tabular-nums;color:#9aa0a6}
 .live{color:#4caf50;font-weight:600}
 .blk{color:#e0726b;font-weight:600}
 .muted{color:#777}
 .badge{display:inline-block;margin-left:7px;min-width:18px;padding:0 6px;border-radius:9px;background:#e0726b;color:#fff;font-size:12px;font-weight:700;line-height:18px;text-align:center}
 .entryon{color:#4caf50;font-weight:600}
 .entryoff{color:#9aa0a6}
 .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
 .sep{color:#444}
 #updatebanner{display:none;background:#7a5b16;color:#fff7e0;padding:10px 16px;font-size:14px;border-bottom:1px solid #b08a2e}
 #updatebanner.show{display:block}
 /* Hide controls that only make sense on the host computer (opening a judge window
    needs the Window Management API and a real second monitor) when on a touch phone. */
 @media (hover:none) and (pointer:coarse){ .deskonly{display:none !important} }
 /* Phone layout: stack the screen table into one card per screen with labelled rows. */
 @media (max-width:760px){
   .bar{gap:8px;padding:10px 12px}
   select,input,button{font-size:16px;padding:9px 12px} /* 16px avoids iOS zoom-on-focus */
   .bar .sep{display:none}
   .bar label{width:100%;margin-top:2px}
   thead{display:none}
   table,tbody,tr,td{display:block;width:auto}
   tr{background:#23262c;border:1px solid #3a3e45;border-radius:8px;margin:12px;padding:6px 12px 12px}
   td{border-bottom:1px solid #2c2f35;padding:9px 0}
   tr td:last-child{border-bottom:none}
   td::before{content:attr(data-label);display:block;color:#9aa0a6;font-size:12px;margin-bottom:5px}
   td[data-label="Screen"]{font-size:18px;font-weight:600;border-bottom:1px solid #2c2f35}
   td[data-label="Screen"]::before{content:none}
   td.status{font-size:16px}
   td select{width:100%}
   .grp{gap:8px}
   .grp button{flex:1 1 auto;min-height:44px;min-width:84px}
   tr td.muted{background:none;border:none}
 }
</style>
</head>
<body>
<header>Photo Judge — Operator Console<span id="version" style="float:right;font-weight:400;opacity:.6;font-size:.8em"></span></header>
<div id="updatebanner"></div>
<div class="bar">
  <label>Session</label>
  <select id="session"></select>
  <button id="newbtn" class="primary">➕ New session</button>
  <button id="editsession">Edit session</button>
  <button id="pdfbtn">⤓ Score sheet</button>
  <button id="archivesession" style="display:none">🗄 Archive Session</button>
  <button id="delsession" class="danger">Delete</button>
  <button id="iobtn">⇄ Import / Export</button>
  <span class="sep">|</span>
  <button id="createscreen" class="primary">➕ Create Screen</button>
  <button id="panicblack">⬛ Black all</button>
  <button id="reviewbtn">🛂 Review entries<span id="pendbadge" class="badge" style="display:none"></span></button>
  <span class="spacer"></span>
  <button id="closeapp" class="danger">✕ Close App</button>
</div>
<div id="sessdesc" class="sessdesc"></div>
<div id="judgebar" class="judgebar">
  <span id="jb-state" class="jb-state"></span>
  <span id="jb-joined" class="jb-joined"></span>
  <span class="jb-spacer"></span>
  <button id="jb-start" class="primary">▶ Start</button>
  <button id="jb-pause" style="display:none">⏸ Pause</button>
  <button id="jb-resume" class="primary" style="display:none">▶ Resume</button>
  <button id="jb-restart" style="display:none">↻ Restart</button>
  <button id="jb-end" class="danger" style="display:none">■ End</button>
  <div id="jb-names" class="jb-names"></div>
</div>
<table>
 <thead><tr><th>Screen</th><th>Type</th><th>Category</th><th>Orientation</th><th></th><th>Showing</th><th>Controls</th></tr></thead>
 <tbody id="rows"></tbody>
</table>
<div id="preview">
  <div class="pv-head">
    <span id="pv-info" class="pv-info"></span>
    <span class="jb-spacer"></span>
    <button id="pv-prev">◀ Prev</button>
    <button id="pv-next" class="primary">Next ▶</button>
  </div>
  <div class="pv-body">
    <div id="pv-stage" class="pv-stage"></div>
    <div id="pv-side" class="pv-side">
      <div id="pv-sidehint" class="pv-hint" style="display:none"></div>
      <div id="pv-score" style="display:none">
        <div class="pv-lbl">Score <span id="pv-winflag" class="winflag" style="display:none"></span></div>
        <input id="pv-scoreinput" type="text" inputmode="decimal" placeholder="—" autocomplete="off">
        <div id="pv-scorehint" class="pv-hint">Press Enter to save · saved per photo.</div>
      </div>
      <div id="pv-board" style="display:none"></div>
    </div>
  </div>
</div>
<div id="monpick"><div class="monbox" id="monbox"></div></div>
<div id="sessmodal"><div class="card">
  <h3 id="sessmodal-title">New session</h3>
  <div class="fld"><label for="sm-date">Date</label><input type="date" id="sm-date"></div>
  <div class="fld"><label for="sm-desc">Description (optional)</label>
    <textarea id="sm-desc" maxlength="500" placeholder="e.g. April club competition — judged by Jane Smith"></textarea></div>
  <div class="btns"><button id="sm-cancel">Cancel</button><button id="sm-save" class="primary">Create</button></div>
</div></div>
<div id="jstartmodal" class="" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:2000">
  <div class="card" style="background:#23262c;border:1px solid #3a3e45;border-radius:8px;padding:20px;width:min(460px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.55)">
  <h3 style="margin:0 0 6px;font-size:16px">Start judging session</h3>
  <div id="js-session" style="font-size:13.5px;color:#9aa0a6;margin-bottom:14px"></div>
  <ul class="rules" id="js-rules"></ul>
  <div class="warn" id="js-warn"></div>
  <div class="btns" style="display:flex;gap:10px;justify-content:flex-end">
    <button id="js-cancel">Cancel</button><button id="js-go" class="primary">▶ Start judging</button>
  </div>
  </div>
</div>
<div id="toasts"></div>

<script>
let state = {sessions:[], categories:[], screens:[]};
let pendingSelect = null;
let screenMonitor = {};   // screen name -> chosen monitor index (remembered for relaunch)
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
const currentSession = () => $('session').value;

// Tell the server which session the console has selected, so the Session Management
// page can open to it. Guarded so it only posts on an actual change (not every render).
let lastPostedSession = null;
function syncSelectedSession(){
 const v = currentSession();
 if(v && v !== lastPostedSession){ lastPostedSession = v; post('/api/console/session', {sessionId:v}); }
}

function toast(msg, kind){
 const t = document.createElement('div');
 t.className = 'toast' + (kind ? ' '+kind : '');
 t.textContent = msg;
 $('toasts').appendChild(t);
 requestAnimationFrame(() => t.classList.add('show'));
 setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 3200);
}

function btn(label, fn){ const b=document.createElement('button'); b.textContent=label; b.onclick=fn; return b; }
function cmd(name, action){ post('/api/screen/cmd', {name, action}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function selectedSession(){ return state.sessions.find(s => s.id === currentSession()); }
let runLock = false; // a presentation mode is on but no run is active → block slideshow control
let pvTarget = null;  // {session,category,orientation,file} of the live photo in the panel
let pvFinished = false; // tracks the finished transition so the "end the session?" prompt fires once

function statusText(sc){
 if(sc.blackout) return '<span class="blk">BLACK</span>';
 if(!sc.category) return '<span class="muted">idle</span>';
 if(sc.position <= 0) return 'Title card';
 if(sc.position > sc.count) return 'End (black)';
 return '<span class="live">'+sc.position+' / '+sc.count+'</span>';
}

function render(){
 // Defensive: a server push (state = JSON.parse(...)) replaces these wholesale, and an
 // empty collection can arrive as JSON null. render() treats them as arrays, so normalize
 // before any .forEach/.length/.map below.
 if(!state.sessions) state.sessions = [];
 if(!state.screens) state.screens = [];
 if(!state.categories) state.categories = [];
 if(state.version) $('version').textContent = 'v' + state.version;
 const ub = $('updatebanner');
 if(state.newerVersion){
   ub.textContent = '⬆ A newer version of Photo Judge (v'+state.newerVersion+') was launched. Click “✕ Close App”, then reopen Photo Judge to update.';
   ub.classList.add('show');
 } else {
   ub.classList.remove('show');
 }
 // Session dropdown
 const sel = $('session'); const cur = sel.value;
 sel.innerHTML = '';
 state.sessions.forEach(s => {
   const o = document.createElement('option'); o.value=s.id; o.textContent=s.date+'  (#'+s.id+')'+(s.endedAt?'  ✓ judged':''); sel.appendChild(o);
 });
 const ids = state.sessions.map(s=>s.id);
 if(pendingSelect && ids.includes(pendingSelect)){ sel.value=pendingSelect; pendingSelect=null; }
 else if(cur && ids.includes(cur)){ sel.value = cur; } // keep the user's current pick on this page
 else if(state.selectedSessionId && ids.includes(state.selectedSessionId)){ sel.value = state.selectedSessionId; } // open to the app-wide current session
 else if(ids.length){ sel.value = ids[ids.length-1]; } // nothing persisted (or it was archived/deleted) — fall back to the latest
 // else: no sessions left (unselected)
 syncSelectedSession();

 // Categories offered for loading = the selected session's active slate (per-session).
 const selSession = state.sessions.find(s => s.id === sel.value);
 const sessionCats = selSession ? (selSession.categories || []) : [];

 // "Archive Session" is only offered once a session's date is in the past.
 $('archivesession').style.display = (selSession && selSession.date < todayStr()) ? '' : 'none';

 // Selected session's description strip (below the action bar).
 const sd = $('sessdesc');
 if(selSession && selSession.description){ sd.textContent = '📝  ' + selSession.description; sd.classList.add('show'); }
 else { sd.textContent = ''; sd.classList.remove('show'); }

 // Presentation lifecycle bar: Start / Pause / Resume / End. Shown when any presentation
 // mode is on. Until a run is active the slideshow stays black and the screen-table nav is
 // locked (runLock), enforced server-side too; while a run presents the panel drives.
 runLock = false;
 const presOn = !!(state.settings && (state.settings.guidedPresentation || state.settings.scoreKeeperEnabled || state.settings.judgeScoringEnabled));
 const isJudgeMode = !!(state.settings && state.settings.judgeScoringEnabled);
 const run = state.solo || null;        // active guided run (soloView) or null
 const running = !!run;
 const paused = !!(run && run.paused);
 runLock = presOn && !running;
 const jbar = $('judgebar');
 if(!presOn){
   jbar.classList.remove('show','live');
 } else {
   jbar.classList.add('show');
   jbar.classList.toggle('live', running && !paused);
   const ended = !running && !!(selSession && selSession.endedAt);
   const st = $('jb-state');
   st.className = 'jb-state ' + (running && !paused ? 'on' : 'off');
   st.textContent = running ? (paused ? '⏸ Paused — reconfigure screens, then Resume' : '● Presenting')
     : ended ? '■ Ended — scores locked' : '○ Not started';
   // Judge-only: joined count + connected-judge tags.
   const jdata = state.judges || null;
   const needed = selSession ? (selSession.judgesNeeded||0) : 0;
   const primaries = jdata ? (jdata.primaries||0) : 0;
   const joined = jdata ? (jdata.joined||[]) : [];
   if(isJudgeMode){
     $('jb-joined').style.display=''; $('jb-names').style.display='';
     $('jb-joined').innerHTML = needed ? ('Judges joined: <b>'+primaries+'</b> of <b>'+needed+'</b>') : ('Judges joined: <b>'+primaries+'</b>');
     $('jb-names').innerHTML = joined.length
       ? joined.map(j => '<span class="jb-tag'+(j.alternate?' alt':'')+'">'+esc(j.name)+(j.alternate?' · alternate':'')+'</span>').join('')
       : '<span class="muted">No judges connected yet — they join by scanning the Judge QR.</span>';
   } else {
     $('jb-joined').style.display='none'; $('jb-names').style.display='none';
   }
   const bStart=$('jb-start'), bPause=$('jb-pause'), bResume=$('jb-resume'), bRestart=$('jb-restart'), bEnd=$('jb-end');
   bStart.style.display = (!running && !ended) ? '' : 'none';
   bPause.style.display = (running && !paused) ? '' : 'none';
   bResume.style.display = (running && paused) ? '' : 'none';
   bEnd.style.display = running ? '' : 'none';
   // Restart (erases scores, re-opens) is offered while running/paused or after End.
   bRestart.style.display = (running || ended) ? '' : 'none';
   bRestart.textContent = ended ? '↻ Restart (re-open)' : '↻ Restart';
   if(!running && !ended){
     let ready = true, why = 'Start the presentation';
     if(!selSession){ ready=false; why='Select a session first'; }
     else if(isJudgeMode){
       const rangeSet = selSession.judgeMin != null && selSession.judgeMax != null;
       if(needed < 1){ ready=false; why='Set “judges needed” on Session Management first'; }
       else if(!rangeSet){ ready=false; why='Set the score range on Session Management first'; }
       else if(primaries < needed){ ready=false; why='Waiting for all judges to join'; }
     }
     bStart.disabled = !ready;
     bStart.title = why;
     bStart.textContent = isJudgeMode ? '▶ Start judging' : '▶ Start';
   }
 }
 updatePreview();

 // Review-entries button + badge — hidden entirely when member entries are off.
 const entriesEnabled = !!(state.settings && state.settings.entriesEnabled);
 $('reviewbtn').style.display = entriesEnabled ? '' : 'none';
 const pb = $('pendbadge');
 if(entriesEnabled && state.pendingCount > 0){ pb.textContent = state.pendingCount; pb.style.display=''; }
 else pb.style.display='none';

 // Screen rows
 const rows = $('rows'); rows.innerHTML = '';
 if(state.screens.length === 0){
   rows.innerHTML = '<tr><td colspan="7" class="muted">No screens yet — click “Create Screen”, name it, then use “⧉ Open window” on its row to launch the display.</td></tr>';
   return;
 }
 const entrySess = state.sessions.find(s => s.id === state.entrySessionId);
 state.screens.forEach(sc => {
   const tr = document.createElement('tr');
   const isEntry = sc.type === 'entry';
   const isJudge = sc.type === 'judge';

   const tdN = document.createElement('td'); tdN.dataset.label='Screen'; tdN.textContent = sc.name; tr.appendChild(tdN);

   // Type dropdown. Entry QR is hidden entirely when member entries are off; Judge QR
   // stays listed but disabled when judge scoring is off. (A screen already set to a
   // type keeps its option so the dropdown still reflects the current value.)
   const entriesOn = !!(state.settings && state.settings.entriesEnabled);
   const judgeOn = !!(state.settings && state.settings.judgeScoringEnabled);
   const tdT = document.createElement('td'); tdT.dataset.label='Type';
   const ts = document.createElement('select');

   const tdS = document.createElement('td'); tdS.className='status'; tdS.dataset.label='Showing'; tdS.innerHTML = statusText(sc); tr.appendChild(tdS);

   // In a presentation mode the table nav is locked: before Start (runLock) and while the
   // panel is actively presenting; it's only operable when the run is paused (to reconfigure).
   if(runLock || (running && !paused)){

// ---- Presentation panel: current photo + Prev/Next + inline scoring / judge board -----
function updatePreview(){
 const run = state.solo || null;
 const pv = $('preview');
 if(!run){ pv.classList.remove('show'); pvTarget = null; pvFinished = false; return; }
 pv.classList.add('show');
 const ss = state.sessions.find(s => s.id === run.sessionId) || {};
 const paused = !!run.paused, locked = !!run.locked;
 // When every photo has been shown, offer to End the session (lock the scores). Fires once
 // per finished transition; the operator can decline and keep stepping/End manually.
 if(run.finished && !pvFinished){
   pvFinished = true;
   pjConfirm('That’s the last photo — every category has been shown. End the session now to lock in the scores?',
     {title:'End the session?', okLabel:'End — lock scores', danger:true}).then(ok => {
     if(ok) post('/api/presentation/end', {}).then(r => { if(!r.ok) r.text().then(t=>pjAlert(t)); else toast('Session ended — scores locked'); });
   });
 } else if(!run.finished){ pvFinished = false; }
 const onPhoto = run.position >= 1 && run.position <= run.count;
 $('pv-info').innerHTML = '<b>'+esc(run.category||'')+'</b> · '+esc(run.orientation||'')
   + ' · segment '+(run.index+1)+' / '+run.total + (paused ? ' · <span class="pv-paused">paused</span>' : '');
 const stage = $('pv-stage');
 if(run.finished){
   stage.innerHTML = '<div class="pv-card"><div class="pv-cat">All done</div><div class="pv-sub">Every category has been shown. Press <b>End</b> to lock the scores.</div></div>';
 } else if(run.position <= 0){
   stage.innerHTML = '<div class="pv-card"><div class="pv-cat">'+esc(run.category||'')+'</div><div class="pv-sub">'+esc(run.orientation||'')+' · Title card</div></div>';
 } else if(!onPhoto){
   stage.innerHTML = '<div class="pv-card"><div class="pv-cat">End of '+esc(run.category||'')+'</div><div class="pv-sub">'+esc(run.orientation||'')+'</div></div>';
 } else {
   stage.innerHTML = '<img src="'+esc(run.photoUrl)+'" alt="">'
     + '<div class="pv-meta"><b>'+esc(run.title||'')+'</b>'+(run.photographer ? ' · '+esc(run.photographer) : '')
     + ' <span class="pv-pos">'+run.position+' / '+run.count+'</span></div>';
 }
 $('pv-prev').disabled = paused;
 $('pv-next').disabled = paused;
 // Inline scoring (Score Keeper) or the judge board (Judge mode) — unless a separate
 // scorekeeper screen is in use, in which case the second operator scores on /score.
 const isJudgeMode = !!(state.settings && state.settings.judgeScoringEnabled);
 const isScoreMode = !!(state.settings && state.settings.scoreKeeperEnabled);
 const sepScreen = !!(state.settings && state.settings.scorekeeperScreen) && (isScoreMode || isJudgeMode);
 const sbox = $('pv-score'), board = $('pv-board'), hint = $('pv-sidehint');
 hint.style.display = 'none';
 if(sepScreen){
   sbox.style.display='none'; board.style.display='none'; pvTarget = null;
   hint.style.display=''; hint.textContent = isJudgeMode
     ? 'The judge board is on the Scoring page (separate scorekeeper screen).'
     : 'Scores are entered on the Scoring page (separate scorekeeper screen).';
 } else if(isScoreMode){
   board.style.display='none';
   sbox.style.display = onPhoto ? '' : 'none';
   if(onPhoto){
     pvTarget = {session:run.sessionId, category:run.category, orientation:run.orientation, file:run.file};
     const inp = $('pv-scoreinput');
     if(document.activeElement !== inp){ inp.value = run.score || ''; inp.classList.toggle('set', !!run.score); }
     inp.disabled = locked;
     const isWin = ss.winThreshold != null && run.score && parseFloat(run.score) >= ss.winThreshold;
     $('pv-winflag').style.display = isWin ? 'inline-block' : 'none';
     $('pv-winflag').textContent = isWin ? '🏆 Winner' : '';
     $('pv-scorehint').textContent = locked ? 'Session ended — scores are locked.'
       : ((ss.maxPoints != null ? 'Out of '+ss.maxPoints+' · ' : '') + 'Press Enter to save.'
          + (ss.winThreshold != null ? ' Winner at '+ss.winThreshold+'+.' : ''));
   } else { pvTarget = null; }
 } else if(isJudgeMode){
   sbox.style.display='none'; board.style.display=''; pvTarget = null;
   updateConsoleBoard();
 } else {
   sbox.style.display='none'; board.style.display='none'; pvTarget = null;
 }
}

// Judge board on the console (mirrors the Scoring page board; the server resolves the live target).
async function updateConsoleBoard(){
 let b; try { b = await (await fetch('/api/judge/board')).json(); } catch(e){ return; }
 renderConsoleBoard(b);
}
function renderConsoleBoard(b){
 const el = $('pv-board');
 if(b && !b.active){ el.innerHTML = '<div class="muted" style="padding:8px 0">Judging hasn’t started.</div>'; return; }
 if(!b || !b.open){ el.innerHTML = '<div class="muted" style="padding:8px 0">No photo is live to judge yet.</div>'; return; }
 let n = 0;
 const rows = (b.judges || []).map(j => {
   const label = b.anonymize ? (j.alternate ? 'Alternate' : ('Judge ' + (++n))) : (j.name || (j.alternate ? 'Alternate' : 'Judge'));
   let sc = '—', cls = 'jscore none';
   if(j.deferred){ sc = 'deferred'; }
   else if(j.requested){ sc = 're-scoring…'; }
   else if(j.score){ sc = j.score; cls = 'jscore'; }
   const tag = j.alternate ? '<span class="jtag">alt</span>' : (j.present ? '' : '<span class="jtag">away</span>');
   return '<div class="jrow"><span class="jname">'+esc(label)+'</span>'+tag
     + '<span class="'+cls+'">'+esc(sc)+'</span>'
     + '<button class="jre" data-k="'+esc(j.key)+'">Rescore</button></div>';
 }).join('') || '<div class="muted" style="padding:8px 0">No judges connected yet.</div>';
 const done = b.needed ? ('<span class="'+(b.complete?'done':'pending')+'">'+b.counting+' / '+b.needed+(b.complete?' ✓':'')+'</span>') : (b.counting+' scored');
 el.innerHTML = rows
   + '<div class="combined">'+(b.aggregation === 'total' ? 'Total' : 'Average')+': <b>'+esc(b.combined || '—')+'</b> &nbsp;·&nbsp; '+done+'</div>'
   + '<button class="rescoreall">🔁 Ask all judges to re-score</button>';
 el.querySelectorAll('.jre').forEach(btn => btn.onclick = () => boardRescore(b, btn.dataset.k));
 el.querySelector('.rescoreall').onclick = () => boardRescore(b, '');
}

 toast(judge ? 'Re-score requested' : 'Re-score requested for all judges');
 updateConsoleBoard();
}

function chooseMonitor(screens){
 return new Promise(resolve => {
   if(screens.length <= 1){ resolve(0); return; }
   const box = $('monbox');
   box.innerHTML = '<h3>Place this screen on which monitor?</h3>';
   screens.forEach((s, i) => {
     const tags = [s.width+'×'+s.height];
     if(s.isPrimary) tags.push('primary');
     if(s.isInternal) tags.push('built-in');
     const b = document.createElement('button'); b.className = 'monbtn';
     b.textContent = 'Monitor '+(i+1)+' — '+tags.join(', ')+'  ·  at ('+s.left+', '+s.top+')';
     b.onclick = () => { $('monpick').classList.remove('show'); resolve(i); };
     box.appendChild(b);
   });
   const c = document.createElement('button'); c.className = 'monbtn moncancel'; c.textContent = 'Leave where it opened';
   c.onclick = () => { $('monpick').classList.remove('show'); resolve(-1); };
   box.appendChild(c);
   $('monpick').classList.add('show');
 });
}

// Open synchronously (survives pop-up blockers), then best-effort place it on a
// chosen monitor via the Window Management API. Because the window then physically
// sits on that monitor, a plain fullscreen in the output page lands there.
async function openOutputWindow(name){
 const w = window.open('/output?screen='+encodeURIComponent(name), 'pjwin_'+name, 'width=1024,height=640');
 if(!w){ pjAlert('Your browser blocked the pop-up window.\n\nAllow pop-ups for this site, then click “⧉ Open window” on the screen’s row to launch it.', {title:'Pop-up blocked'}); return; }
 w.focus();
 if(!('getScreenDetails' in window)) return;                 // older browser: drag + F fallback
 let screens;
 try { screens = (await window.getScreenDetails()).screens; } catch(e){ return; } // permission denied
 if(!screens || !screens.length) return;
 let idx = (name in screenMonitor) ? screenMonitor[name]
         : (screens.length === 1 ? 0 : await chooseMonitor(screens));
 if(idx === -1) return;                                       // operator left it where it opened
 if(idx == null || !screens[idx]) idx = 0;
 screenMonitor[name] = idx;
 const s = screens[idx];
 try { w.moveTo(s.availLeft, s.availTop); w.resizeTo(s.availWidth, s.availHeight); w.focus(); } catch(e){}
}

 const r = await post('/api/screen/create', {name: name.trim()});
 if(!r.ok){ pjAlert('Could not create screen: '+(await r.text())); return; }
 toast('Screen “'+name.trim()+'” created — use ⧉ Open window on its row to launch it');
};

async function deleteScreen(name){
 if(!await pjConfirm('Delete screen “'+name+'”?\n\nIf its output window is open it will go black. Screens are saved between launches, so this removes it for good.', {title:'Delete screen', okLabel:'Delete', danger:true})) return;
 post('/api/screen/delete', {name}).then(r => {
   if(r.ok) toast('Screen “'+name+'” deleted', 'del');
   else toast('Could not delete screen', 'del');
 });
}

$('panicblack').onclick = () => { state.screens.forEach(sc => { if(!sc.blackout && sc.type !== 'entry' && sc.type !== 'judge') cmd(sc.name,'blackout'); }); };
$('reviewbtn').onclick = () => location.href = '/review';

// Re-render when the selected session changes so each screen's category menu
// reflects that session's own active slate.
$('session').addEventListener('change', render);

$('closeapp').onclick = async () => {
 if(!await pjConfirm('Close Photo Judge?\n\nThis stops the app entirely — the output windows will go blank and the program exits. Use this when the session is finished.', {title:'Close Photo Judge', okLabel:'Close app', danger:true})) return;
 try { await post('/api/shutdown', {}); } catch(e){}
 if(es) es.close();
 document.body.innerHTML = '<div style="padding:48px;font-family:system-ui;color:#9aa0a6;font-size:16px">Photo Judge has been closed.<br><br>You can close this tab and the output windows now.</div>';
};

const es = new EventSource('/api/events?role=console');
es.onmessage = e => { state = JSON.parse(e.data); render(); };
render();
</script>
