<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Judge</title>
<style>
 :root{color-scheme:dark}
 html,body{margin:0;height:100%}
 body{background:#0f1115;color:#e8e8e8;font-family:system-ui,Segoe UI,sans-serif;
   display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
 .wrap{max-width:560px;width:100%}
 #logo{max-width:70vw;max-height:34vh;object-fit:contain;margin:0 auto 28px;display:none}
 h1{font-size:24px;margin:0 0 10px;font-weight:700}
 .date{color:#9aa0a6;font-size:16px;margin-bottom:26px}
 .enter{display:inline-block;background:#2d6cdf;color:#fff;text-decoration:none;font-size:19px;
   font-weight:600;padding:15px 34px;border-radius:12px;box-shadow:0 4px 16px rgba(45,108,223,.35)}
 .enter:active{transform:translateY(1px)}
 .closed{color:#8b9097;font-size:17px;line-height:1.5}
 #open,#shut{display:none}
</style>
</head>
<body>
<div class="wrap">
 <img id="logo" alt="" src="/api/logo">
 <div id="open">
   <h1>Entries are open</h1>
   <div class="date" id="forDate"></div>
   <a class="enter" href="/entry">Enter your photos →</a>
 </div>
 <div id="shut">
   <h1>Photo Judge</h1>
   <div class="closed">No entry form is open right now.<br>Please check with the meeting host.</div>
 </div>
</div>
<script>
const logo = document.getElementById('logo');
logo.onload = () => { logo.style.display = 'block'; };
logo.onerror = () => { logo.style.display = 'none'; };

function render(st){
 const open = !!st.open;
 document.getElementById('open').style.display = open ? 'block' : 'none';
 document.getElementById('shut').style.display = open ? 'none' : 'block';
 if(open){
   document.getElementById('forDate').textContent =
     st.date ? ('for the ' + st.date + ' competition') : '';
 }
}
const es = new EventSource('/api/events?role=entry');
es.onmessage = e => { try { render(JSON.parse(e.data)); } catch(_){} };
</script>
</body>
</html>
