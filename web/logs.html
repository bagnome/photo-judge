<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Judge — Logs</title>
<style>
 body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#1b1d21;color:#e8e8e8}
 header{background:#111;padding:10px 16px;font-weight:600;font-size:15px}
 .wrap{max-width:900px;padding:16px 16px 60px}
 .card{background:#23262c;border:1px solid #3a3e45;border-radius:8px;padding:18px 20px;margin:0 0 16px}
 .card h2{margin:0 0 4px;font-size:16px}
 .sub{color:#8a9099;font-size:13px;line-height:1.5;margin:0 0 12px}
 code{color:#c9ccd1;word-break:break-all}
 .status{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;margin:6px 0 14px}
 .status .kv{font-size:13px;color:#9aa0a6}
 .status .kv b{color:#e8e8e8;font-variant-numeric:tabular-nums}
 .on{color:#5fbf7a}.off{color:#9aa0a6}
 .bar{height:8px;background:#2a2d33;border-radius:5px;overflow:hidden;margin:8px 0 2px}
 .bar > i{display:block;height:100%;background:#2d6cdf}
 .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
 button{font-size:14px;padding:8px 12px;background:#2a2d33;color:#eee;border:1px solid #444;border-radius:5px;cursor:pointer}
 button:hover{background:#363a42}
 button:disabled{opacity:.45;cursor:not-allowed}
 button.primary{background:#2d6cdf;border-color:#2d6cdf}
 button.primary:hover{background:#3b78e6}
 button.danger{background:#a83232;border-color:#a83232}
 button.danger:hover{background:#c23b3b}
 a.dl{color:#7fb2ff;text-decoration:none}
 a.dl:hover{text-decoration:underline}
 table{width:100%;border-collapse:collapse;font-size:13.5px}
 th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #2c2f35;white-space:nowrap}
 th{color:#9aa0a6;font-weight:600;font-size:12.5px}
 td.name{white-space:normal;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
 td.size,td.time{font-variant-numeric:tabular-nums;color:#c9ccd1}
 .empty{color:#777;font-size:13px;padding:14px 0}
 .pager{display:flex;gap:10px;align-items:center;margin-top:12px;color:#9aa0a6;font-size:13px}
 #toasts{position:fixed;bottom:16px;left:16px;display:flex;flex-direction:column;gap:8px;z-index:1000}
 .toast{background:#2e7d46;color:#fff;padding:10px 14px;border-radius:6px;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:340px}
 .toast.show{opacity:1;transform:none}
 .toast.del{background:#a83232}
 @media (max-width:760px){ th.ua,td.ua{display:none} }
</style>
</head>
<body>
<header>Photo Judge — Logs</header>
<div class="wrap">

  <div class="card">
    <h2>Debug logs</h2>
    <div class="sub">Activity is written to <b>one log file per day</b> (columns: timestamp, type, file:line, message) while <b>debug logging</b> is on — turn it on/off on the <a class="dl" href="/settings">Settings</a> page. Files are stored on this computer at:<br><code id="dir">…</code></div>
    <div class="status">
      <div class="kv">Status: <b id="statusVal" class="off">—</b></div>
      <div class="kv">Files: <b id="fileCount">0</b></div>
      <div class="kv">Size: <b id="sizeVal">0</b> of <b id="maxVal">0</b></div>
    </div>
    <div class="bar"><i id="usebar" style="width:0%"></i></div>
    <div class="actions">
      <button type="button" class="primary" id="dlAll">⤓ Download all (zip)</button>
      <button type="button" id="refresh">↻ Refresh</button>
      <button type="button" class="danger" id="clearAll">🗑 Delete all logs</button>
    </div>
  </div>

  <div class="card">
    <div class="actions" style="margin:0 0 12px">
      <label style="font-size:13px;color:#b9bec6;display:flex;align-items:center;gap:6px"><input type="checkbox" id="selAll"> Select all on this page</label>
      <button type="button" id="dlSel" disabled>⤓ Download selected (zip)</button>
    </div>
    <div id="listWrap">
      <table id="tbl">
        <thead><tr><th style="width:26px"></th><th>File</th><th>Date</th><th>Size</th><th style="width:70px"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No log files yet.</div>
    </div>
    <div class="pager">
      <button type="button" id="prev">← Prev</button>
      <span id="pageInfo">Page 1</span>
      <button type="button" id="next">Next →</button>
    </div>
  </div>

</div>
<div id="toasts"></div>

<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post = (u,b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)});
let page = 1, data = null;

function toast(msg, kind){
 const t = document.createElement('div');
 t.className = 'toast' + (kind ? ' '+kind : '');
 t.textContent = msg;
 $('toasts').appendChild(t);
 requestAnimationFrame(() => t.classList.add('show'));
 setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 2600);
}

function fmtBytes(n){
 if(n < 1024) return n + ' B';
 if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
 return (n/1024/1024).toFixed(2) + ' MB';
}
function fmtDur(sec){
 sec = Math.max(0, Math.round(sec));
 const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
 if(h) return h+'h '+m+'m';
 if(m) return m+'m';
 return sec+'s';
}

async function load(){
 try {
   const r = await fetch('/api/logs?page=' + page);
   data = await r.json();
 } catch(e){ toast('Could not load logs', 'del'); return; }
 render();
}

function render(){
 const d = data;
 $('dir').textContent = d.dir || '';
 // status
 const st = $('statusVal');
 if(d.active){
   st.className = 'on';
   let s = '● ON — ' + esc(levelLabel(d.level));
   if(d.logRemainingSeconds >= 0) s += ', auto-off in ' + fmtDur(d.logRemainingSeconds);
   st.textContent = s;
 } else if(d.alwaysErrors){
   st.className = 'off'; st.textContent = 'Off (errors still logged)';
 } else {
   st.className = 'off'; st.textContent = 'Off';
 }
 $('fileCount').textContent = d.totalFiles;
 $('sizeVal').textContent = fmtBytes(d.totalBytes || 0);
 $('maxVal').textContent = fmtBytes(d.maxBytes || 0);
 const pct = d.maxBytes ? Math.min(100, Math.round((d.totalBytes/d.maxBytes)*100)) : 0;
 $('usebar').style.width = pct + '%';
 $('usebar').style.background = pct >= 90 ? '#d9a441' : '#2d6cdf';

 // rows
 const rows = $('rows'); rows.innerHTML = '';
 const files = d.files || [];
 $('empty').style.display = files.length ? 'none' : 'block';
 $('tbl').style.display = files.length ? '' : 'none';
 files.forEach(f => {
   const tr = document.createElement('tr');
   tr.innerHTML =
     '<td><input type="checkbox" class="sel" value="'+esc(f.name)+'"></td>' +
     '<td class="name">'+esc(f.name)+'</td>' +
     '<td class="time">'+esc(f.time||'')+'</td>' +
     '<td class="size">'+fmtBytes(f.size)+'</td>' +
     '<td><a class="dl" href="/api/log/file?name='+enc(f.name)+'">Download</a></td>';
   rows.appendChild(tr);
 });
 document.querySelectorAll('.sel').forEach(c => c.addEventListener('change', updateSel));
 $('selAll').checked = false;
 updateSel();

 // pager
 const pages = d.pages || 1;
 $('pageInfo').textContent = 'Page ' + d.page + ' of ' + Math.max(1, pages);
 $('prev').disabled = d.page <= 1;
 $('next').disabled = d.page >= pages;
}

function levelLabel(l){
 return l === 'all' ? 'Everything' : l === 'events' ? 'Errors + events' : 'Requests + events + errors';
}

function selectedNames(){
 return Array.from(document.querySelectorAll('.sel:checked')).map(c => c.value);
}
function updateSel(){
 $('dlSel').disabled = selectedNames().length === 0;
}

async function downloadZip(body, fallbackName){
 const r = await post('/api/logs/zip', body);
 if(!r.ok){ toast('Download failed', 'del'); return; }
 const blob = await r.blob();
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url; a.download = fallbackName;
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(() => URL.revokeObjectURL(url), 4000);
}

$('selAll').addEventListener('change', () => {
 document.querySelectorAll('.sel').forEach(c => c.checked = $('selAll').checked);
 updateSel();
});
$('dlSel').addEventListener('click', () => {
 const names = selectedNames();
 if(!names.length) return;
 downloadZip({names}, 'photo-judge-logs.zip');
});
$('dlAll').addEventListener('click', () => {
 if(!data || !data.totalFiles){ toast('No logs to download'); return; }
 downloadZip({all:true}, 'photo-judge-logs.zip');
});
$('clearAll').addEventListener('click', async () => {
 if(!await pjConfirm('Delete all log files? This can\'t be undone.', {title:'Delete all logs', okLabel:'Delete', danger:true})) return;
 const r = await post('/api/logs/clear', {});
 if(!r.ok){ toast('Could not delete logs', 'del'); return; }
 const j = await r.json();
 toast('Deleted '+(j.removed||0)+' log file'+((j.removed===1)?'':'s'), 'del');
 page = 1; load();
});
$('refresh').addEventListener('click', () => load());
$('prev').addEventListener('click', () => { if(page>1){ page--; load(); } });
$('next').addEventListener('click', () => { page++; load(); });

load();
</script>
<script src="/modal.js"></script>
<script src="/nav.js"></script>
</body>
</html>
