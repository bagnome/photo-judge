<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Judge — Review entries</title>
<style>
 body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#1b1d21;color:#e8e8e8}
 header{background:#111;padding:10px 16px;font-weight:600;font-size:15px}
 .bar{padding:12px 16px;border-bottom:1px solid #333;color:#9aa0a6;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
 button{font-size:14px;padding:6px 10px;background:#2a2d33;color:#eee;border:1px solid #444;border-radius:5px;cursor:pointer}
 button:hover{background:#363a42}
 button.ok{background:#2e7d46;border-color:#2e7d46}
 button.ok:hover{background:#359152}
 button.no{background:#a83232;border-color:#a83232}
 button.no:hover{background:#c23b3b}
 a.back{color:#7fb2ff;text-decoration:none;font-size:14px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:16px}
 .card{background:#23262c;border:1px solid #3a3e45;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
 .card .ph{width:100%;height:200px;object-fit:contain;background:#0d0f12;cursor:zoom-in}
 .card .meta{padding:11px 13px;flex:1}
 .card .ti{font-weight:600;font-size:15px;word-break:break-word;margin-bottom:4px}
 .card .who{font-size:13.5px;color:#cdd2da}
 .card .tag{font-size:12px;color:#9aa0a6;margin-top:5px}
 .card .acts{display:flex;gap:8px;padding:0 13px 13px}
 .card .acts button{flex:1}
 .empty{padding:48px 16px;text-align:center;color:#9aa0a6;font-size:16px;line-height:1.6}
 #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:3000}
 #lightbox.show{display:flex}
 #lightbox img{max-width:94vw;max-height:94vh;object-fit:contain}
</style>
</head>
<body>
<header>Photo Judge — Review entries<span id="version" style="float:right;font-weight:400;opacity:.6;font-size:.8em"></span></header>
<div class="bar">
 <a class="back" href="/console">← Back to console</a>
 <span id="sub"></span>
 <span style="flex:1"></span>
 <button id="refresh">↻ Refresh</button>
</div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">No entries waiting for review.</div>
<div id="lightbox"><img alt=""></div>

<script>
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
let sessionId = '';

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

async function load(){
 let j;
 try { j = await (await fetch('/api/entry/pending')).json(); } catch(_){ return; }
 sessionId = j.sessionId || '';
 const list = j.pending || [];
 $('sub').textContent = sessionId ? ('Session #'+sessionId+' · '+list.length+' waiting') : 'No entry session';
 const grid = $('grid'); grid.innerHTML = '';
 $('empty').style.display = list.length ? 'none' : 'block';
 list.forEach(e => {
   const c = document.createElement('div'); c.className='card';
   c.innerHTML =
     '<img class="ph" src="'+e.photoUrl+'" alt="">' +
     '<div class="meta">' +
       '<div class="ti">'+esc(e.title || '(untitled)')+'</div>' +
       '<div class="who">'+esc(e.firstName+' '+e.lastName)+'</div>' +
       '<div class="tag">'+esc(e.category)+' · '+esc(e.orientation)+'</div>' +
     '</div>' +
     '<div class="acts"></div>';
   c.querySelector('.ph').onclick = () => { const lb=$('lightbox'); lb.querySelector('img').src=e.photoUrl; lb.classList.add('show'); };
   const acts = c.querySelector('.acts');
   const ap = document.createElement('button'); ap.className='ok'; ap.textContent='✓ Approve';
   ap.onclick = async () => { ap.disabled=true; const r=await post('/api/entry/approve',{sessionId, id:e.id}); if(r.ok) load(); else ap.disabled=false; };
   const rj = document.createElement('button'); rj.className='no'; rj.textContent='✕ Reject';
   rj.onclick = async () => { rj.disabled=true; const r=await post('/api/entry/reject',{sessionId, id:e.id}); if(r.ok) load(); else rj.disabled=false; };
   acts.appendChild(ap); acts.appendChild(rj);
   grid.appendChild(c);
 });
}

$('refresh').onclick = load;
$('lightbox').onclick = () => $('lightbox').classList.remove('show');

// The console stream tells us when the pending set changes (approve/reject/new submit).
let lastPending = -1;
const es = new EventSource('/api/events?role=console');
es.onmessage = e => {
 try {
   const st = JSON.parse(e.data);
   if(st.version) $('version').textContent = 'v'+st.version;
   if(st.pendingCount !== lastPending){ lastPending = st.pendingCount; load(); }
 } catch(_){}
};
load();
</script>
<script src="/nav.js"></script>
</body>
</html>
