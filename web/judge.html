<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Judge — Judge</title>
<style>
 :root{color-scheme:dark}
 html,body{margin:0;background:#16181c;color:#e8e8e8;font-family:system-ui,Segoe UI,sans-serif}
 .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
 h1{font-size:18px;margin:4px 0 16px}
 .card{background:#23262c;border:1px solid #3a3e45;border-radius:10px;padding:18px;margin:0 0 14px}
 label{display:block;color:#9aa0a6;font-size:13px;margin:10px 0 4px}
 input[type=text],input[type=number]{width:100%;box-sizing:border-box;font-size:17px;padding:11px 12px;
   background:#2a2d33;color:#fff;border:1px solid #444;border-radius:7px}
 input:focus{border-color:#2d6cdf;outline:none}
 .chk{display:flex;align-items:center;gap:10px;font-size:15px;color:#cdd;margin-top:14px}
 .chk input{width:20px;height:20px}
 button{font-size:16px;padding:12px 16px;border-radius:8px;border:1px solid #444;background:#2a2d33;color:#eee;cursor:pointer;width:100%}
 button.primary{background:#2d6cdf;border-color:#2d6cdf;font-weight:600}
 button.primary:disabled{opacity:.45}
 button.ghost{background:#2a2d33;margin-top:10px}
 .big-score{font-size:30px;text-align:center;font-variant-numeric:tabular-nums}
 .hint{color:#8a9099;font-size:13px;margin-top:6px;line-height:1.45}
 .photo{font-size:13px;color:#9aa0a6}
 .photo b{color:#e8e8e8;font-size:20px;display:block;margin-top:2px}
 .pcat{color:#7fb2ff;font-size:13px}
 .status{border-radius:8px;padding:10px 13px;font-size:14px;margin:0 0 14px;font-weight:600}
 .status.ok{background:#1e3a26;border:1px solid #2e7d46;color:#9be0ad}
 .status.wait{background:#2a2d33;border:1px solid #444;color:#cdd}
 .status.req{background:#3a3320;border:1px solid #b08a2e;color:#ffe9b0}
 .status.none{background:#22252b;border:1px solid #3a3e45;color:#9aa0a6}
 .center{text-align:center;color:#9aa0a6;padding:30px 10px;font-size:15px;line-height:1.5}
 .center .em{font-size:40px;display:block;margin-bottom:10px}
 .who{color:#8a9099;font-size:12.5px;margin-top:14px;text-align:center}
 .who a{color:#7fb2ff;cursor:pointer}
 #toasts{position:fixed;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
 .toast{background:#2e7d46;color:#fff;padding:11px 14px;border-radius:8px;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.5)}
 .toast.del{background:#a83232}
</style>
</head>
<body>
<div class="wrap">
 <h1>🧑‍⚖️ Judge scoring</h1>

 <!-- Name step -->
 <div class="card" id="namecard">
   <label for="jname">Your name</label>
   <input type="text" id="jname" placeholder="First and last name" autocomplete="name">
   <label class="chk"><input type="checkbox" id="jalt"> I'm the <b style="color:#e8e8e8">alternate</b> judge</label>
   <div class="hint">The alternate steps in when a photo was taken by one of the judges.</div>
   <button class="primary" id="startbtn" style="margin-top:16px">Start judging</button>
 </div>

 <!-- Scoring view -->
 <div id="scorecard" style="display:none">
   <div id="status" class="status none">Not submitted yet</div>
   <div class="card" id="photocard">
     <div class="photo"><span class="pcat" id="jpcat"></span><b id="jptitle">—</b><span id="jpphotog"></span></div>
     <div id="scorebox">
       <label for="jscore">Your score</label>
       <input type="number" id="jscore" class="big-score" inputmode="decimal" placeholder="—">
       <div class="hint" id="jrules"></div>
       <button class="primary" id="submitbtn" style="margin-top:14px">Submit score</button>
       <button class="ghost" id="deferbtn" style="display:none">This photo is mine — defer to alternate</button>
     </div>
   </div>
   <div class="who">Judging as <b id="whoname"></b><span id="whoalt"></span> · <a id="changename">change</a></div>
 </div>

 <!-- Idle states -->
 <div class="card" id="idlecard" style="display:none"><div class="center" id="idlemsg"></div></div>
</div>
<div id="toasts"></div>

<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post = (u, b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)});

let me = { name: '', alt: false };
try { me.name = localStorage.getItem('pj-judge-name') || ''; me.alt = localStorage.getItem('pj-judge-alt') === '1'; } catch(_){}
let state = null, es = null, lastFile = null, lastMay = false;

function toast(msg, kind){
 const t = document.createElement('div'); t.className = 'toast' + (kind ? ' '+kind : ''); t.textContent = msg;
 $('toasts').appendChild(t); setTimeout(() => t.remove(), 3000);
}

function showNameStep(){
 $('namecard').style.display = ''; $('scorecard').style.display = 'none'; $('idlecard').style.display = 'none';
 $('jname').value = me.name; $('jalt').checked = me.alt;
}

function connect(){
 if(es) es.close();
 es = new EventSource('/api/events?role=judge&name=' + enc(me.name) + '&alt=' + (me.alt ? '1' : '0'));
 es.onmessage = () => refresh();
 es.onerror = () => {};
 refresh();
}

async function refresh(){
 try {
   const r = await fetch('/api/judge/state?name=' + enc(me.name) + '&alt=' + (me.alt ? '1' : '0'));
   state = await r.json();
 } catch(e){ return; }
 render();
}

function render(){
 if(!me.name){ showNameStep(); return; }
 $('namecard').style.display = 'none';
 $('whoname').textContent = me.name;
 $('whoalt').textContent = me.alt ? ' (alternate)' : '';
 const idle = (em, msg) => { $('scorecard').style.display = 'none'; $('idlecard').style.display = '';
   $('idlemsg').innerHTML = '<span class="em">' + em + '</span>' + msg; };

 if(!state || !state.enabled){ idle('💤', 'Judge scoring is currently turned off.'); return; }
 if(!state.active){ lastFile = null; idle('⏳', 'Waiting for the scorekeeper to start the session…'); return; }
 if(!state.open){ lastFile = null; idle('⏳', 'Waiting for the next photo…'); return; }

 const you = state.you || {};
 // Buzz the phone when a new photo arrives that this judge may score (esp. the alternate).
 if(you.mayScore && (state.file !== lastFile || (!lastMay && you.mayScore))){
   try { navigator.vibrate && navigator.vibrate(200); } catch(_){}
 }
 lastFile = state.file; lastMay = !!you.mayScore;

 $('scorecard').style.display = ''; $('idlecard').style.display = 'none';
 $('jpcat').textContent = state.category || '';
 $('jptitle').textContent = state.title || '—';
 $('jpphotog').textContent = state.photographer ? ('by ' + state.photographer) : '';

 // Status banner
 const st = $('status');
 if(you.deferred){ st.className = 'status wait'; st.textContent = '↪ You deferred this photo to the alternate.'; }
 else if(!you.mayScore){ st.className = 'status wait'; st.textContent = me.alt ? 'Waiting — you score when a judge defers.' : 'Waiting…'; }
 else if(you.requested){ st.className = 'status req'; st.textContent = '🔁 The scorekeeper asked you to re-score this photo.'; }
 else if(you.submitted){ st.className = 'status ok'; st.textContent = '✓ Submitted: ' + you.score; }
 else { st.className = 'status none'; st.textContent = 'Not submitted yet.'; }

 // Score box visibility
 const canScore = !you.deferred && you.mayScore;
 $('scorebox').style.display = canScore ? '' : 'none';
 if(canScore){
   const sIn = $('jscore');
   if(document.activeElement !== sIn) sIn.value = you.submitted ? you.score : '';
   if(state.min != null) sIn.min = state.min; else sIn.removeAttribute('min');
   if(state.max != null) sIn.max = state.max; else sIn.removeAttribute('max');
   if(state.increment != null) sIn.step = state.increment; else sIn.removeAttribute('step');
   const bits = [];
   if(state.min != null || state.max != null) bits.push((state.min != null ? state.min : '0') + '–' + (state.max != null ? state.max : '?'));
   if(state.increment != null) bits.push('steps of ' + state.increment);
   $('jrules').textContent = bits.length ? ('Allowed: ' + bits.join(' · ')) : '';
   $('submitbtn').textContent = you.submitted ? 'Update score' : 'Submit score';
   // A primary judge whose photo this is can defer.
   $('deferbtn').style.display = (state.alternate && !me.alt) ? '' : 'none';
 }
}

async function submitScore(){
 const score = $('jscore').value.trim();
 if(score === ''){ toast('Enter a score first'); return; }
 const r = await post('/api/judge/submit', {session:state.session, category:state.category, orientation:state.orientation,
   file:state.file, name:me.name, alternate:me.alt, score});
 if(!r.ok){ toast((await r.text()) || 'Could not submit', 'del'); refresh(); return; }
 toast('Score submitted'); refresh();
}

async function deferPhoto(){
 const r = await post('/api/judge/defer', {session:state.session, category:state.category, orientation:state.orientation, file:state.file, name:me.name});
 if(!r.ok){ toast((await r.text()) || 'Could not defer', 'del'); return; }
 toast('Deferred to the alternate'); refresh();
}

$('startbtn').onclick = () => {
 const name = $('jname').value.trim();
 if(!name){ toast('Enter your name'); return; }
 me.name = name; me.alt = $('jalt').checked;
 try { localStorage.setItem('pj-judge-name', me.name); localStorage.setItem('pj-judge-alt', me.alt ? '1' : '0'); } catch(_){}
 connect();
};
$('changename').onclick = () => { me.name = ''; showNameStep(); };
$('submitbtn').onclick = submitScore;
$('jscore').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submitScore(); } });
$('deferbtn').onclick = deferPhoto;

if(me.name) connect(); else showNameStep();
</script>
</body>
</html>
