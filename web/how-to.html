<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Judge — How To</title>
<style>
 body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#1b1d21;color:#e8e8e8}
 header{background:#111;padding:10px 16px;font-weight:600;font-size:15px;position:sticky;top:0;z-index:10}
 .layout{display:flex;align-items:flex-start;max-width:1080px;margin:0 auto;gap:24px;padding:20px 16px 60px}
 /* Left tab rail */
 .rail{flex:none;width:236px;position:sticky;top:64px;display:flex;flex-direction:column;gap:4px}
 .rail .tab{display:flex;align-items:center;gap:11px;text-align:left;padding:11px 13px;background:#23262c;
   border:1px solid #2c2f35;border-left:3px solid transparent;border-radius:7px;color:#cfd2d6;font-size:14px;cursor:pointer}
 .rail .tab:hover{background:#272b31;color:#fff}
 .rail .tab.on{background:#1f2530;color:#fff;border-left-color:#2d6cdf}
 .rail .tab .ic{flex:none;width:22px;text-align:center;font-size:17px}
 .rail .tab .soon{margin-left:auto;font-size:10.5px;color:#ffe9b0;background:#5a4a1e;border-radius:9px;padding:1px 7px}
 /* Right content pane */
 .pane{flex:1 1 auto;min-width:0}
 .pane h1{margin:0 0 6px;font-size:22px}
 .intro{color:#c9ccd1;line-height:1.6;background:#23262c;border:1px solid #3a3e45;border-radius:8px;padding:16px 20px;margin:0 0 20px}
 .intro b{color:#e8e8e8}
 .banner{border-radius:8px;padding:13px 18px;margin:0 0 20px;line-height:1.55;font-size:14px}
 .banner.soon{background:#3a3320;border:1px solid #b08a2e;color:#ffe9b0}
 .banner.warn{background:#3a1f1f;border:1px solid #b04a4a;color:#ffd6d6}
 .step{background:#23262c;border:1px solid #3a3e45;border-radius:8px;padding:16px 20px;margin:0 0 16px}
 .step .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
 .num{flex:none;width:28px;height:28px;border-radius:50%;background:#2d6cdf;color:#fff;font-weight:700;
   display:flex;align-items:center;justify-content:center;font-size:14px}
 .step h2{margin:0;font-size:16px}
 .step .body{color:#c9ccd1;line-height:1.6;margin:0;padding-left:40px}
 .step .body b{color:#e8e8e8}
 .step .body code{background:#1b1d21;border:1px solid #3a3e45;border-radius:4px;padding:0 5px;font-size:12.5px}
 .step .body kbd{background:#1b1d21;border:1px solid #3a3e45;border-bottom-width:2px;border-radius:4px;padding:0 6px;font-size:12px}
 .shot{display:block;margin:12px 0 0 40px}
 .shot img{max-width:100%;height:auto;border:1px solid #3a3e45;border-radius:6px;background:#000;display:block}
 .shot .cap{color:#777;font-size:12px;margin-top:6px}
 .note{color:#9aa0a6;font-size:13.5px;line-height:1.55;border-top:1px solid #2c2f35;padding-top:14px;margin-top:4px}
 .note code{background:#1b1d21;border:1px solid #3a3e45;border-radius:4px;padding:0 5px;font-size:12.5px}
 @media (max-width:820px){
   .layout{flex-direction:column;gap:14px}
   .rail{position:static;width:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:8px;padding-bottom:4px}
   .rail .tab{flex:0 0 auto;border-left:none;border-bottom:3px solid transparent;padding:9px 12px}
   .rail .tab.on{border-left:none;border-bottom-color:#2d6cdf}
   .rail .tab .soon{display:none}
   .step .body,.shot{padding-left:0;margin-left:0}
 }
</style>
</head>
<body>
<header>Photo Judge — How To</header>
<div class="layout">
  <nav class="rail" id="rail"></nav>
  <main class="pane" id="pane"></main>
</div>

<script>
const IMG = '/getting-started-images/';
const GUIDES = [
 {
  id:'getting-started', icon:'🚀', title:'Getting started',
  intro:'Run a judging night from start to finish. Each step matches a button on the <b>Operator Console</b>. Click any screenshot to see it full size.',
  steps:[
   { title:'Create a session', img:'gs-create-session.png',
     body:'A <b>session</b> is one competition night — it holds all that evening’s photos. On the console, click <b>➕ New session</b>, pick the date, optionally type a short <b>description</b> to tell it apart later, and click <b>Create</b>.' },
   { title:'Select your session', img:'gs-select-session.png',
     body:'Choose the session you just made from the <b>Session</b> dropdown. Everything you do from here applies to the selected session, and its description shows just under the toolbar.' },
   { title:'Open Session Management',
     body:'From the menu on the right, open <b>Session Management</b> to set up this session’s judging categories. (A brand-new session starts with a copy of your last session’s categories, so you can often skip ahead.)' },
   { title:'Set up the categories', img:'gs-categories.png',
     body:'Use the two panes to <b>activate</b> or <b>deactivate</b> categories, <b>add</b> new ones, <b>delete</b> unused ones, and the arrows to <b>reorder</b> the active list. This order is what shows in the menus and on the score sheet.' },
   { title:'Open the Upload / Reorder page',
     body:'From the menu on the right, open <b>Upload / Reorder</b> to start adding photos to the session.' },
   { title:'Add your photos', img:'gs-upload.png',
     body:'Pick the session and a category, then drag photos in (<b>JPG/PNG</b>). Each one is filed as <b>Landscape</b> or <b>Portrait</b> automatically by its shape. Drag the thumbnails to set the order judges will see, and optionally type a <b>photographer</b> name under each photo.' },
   { title:'Create your screens',
     body:'A <b>screen</b> is a display you present on. On the console, click <b>➕ Create Screen</b> and name each one (e.g. “Landscape monitor”). Screens are remembered between launches.' },
   { title:'Load a category and open the window',
     body:'On a screen’s row, pick a <b>category</b> + <b>orientation</b> and click <b>Load</b> (the display shows the title card), then <b>⧉ Open window</b> to launch the judge-facing window. The other buttons: <b>◀ Prev</b> / <b>Next ▶</b> step through photos, <b>Black</b> / <b>Reveal</b> hides or shows the current photo, and <b>★ Make live</b> shows this screen while blacking the rest.' },
   { title:'Present', img:'gs-present.png',
     body:'Drag the output window onto the correct monitor, then click it (or press <kbd>F</kbd>) to go fullscreen. It starts black — click <b>Next</b> to reveal the first photo, and step through at the judges’ pace.' },
  ]
 },
 {
  id:'categories', icon:'🗂️', title:'Configuring categories',
  intro:'Every session has its own list of judging <b>categories</b>. Manage them on the <b>Session Management</b> page — the <b>Active</b> order drives the console and scoring dropdowns and the score sheet.',
  steps:[
   { title:'Open Session Management', img:'gs-categories.png',
     body:'From the menu on the right, open <b>Session Management</b>, then pick the session at the top. You’ll see two panes: <b>Active</b> (the categories this session uses, in order) and <b>Inactive</b> (ones set aside).' },
   { title:'Add a category',
     body:'Type a name in <b>Add category</b> and click <b>Add to Active</b>. The name doubles as the photo folder and the on-screen <b>title-card</b> text, so spell it the way you want the judges to see it.' },
   { title:'Activate or deactivate',
     body:'Select a category and use <b>Activate →</b> or <b>← Deactivate</b> to move it between the panes. Deactivating <b>keeps</b> its photos — they’re just hidden from this session’s menus until you re-activate it.' },
   { title:'Set the order',
     body:'Select an <b>Active</b> category and use <b>↑ Up</b> / <b>↓ Down</b>. This order is exactly what appears in the console and scoring dropdowns and in the score-sheet PDF (with Landscape before Portrait within each category).' },
   { title:'Delete one you don’t need',
     body:'Select an <b>Inactive</b> category and click <b>Delete</b>. A category that still holds photos can’t be deleted — <b>deactivate</b> it instead, which preserves the photos.' },
  ],
  note:'Each session carries its own category slate, and a new session inherits the most recent one. The <code>categories.txt</code> file only seeds the very first session.'
 },
 {
  id:'adding-photos', icon:'🖼️', title:'Adding photos',
  intro:'Add a session’s photos on the <b>Upload / Reorder</b> page — drop them in, set the order the judges will see, and note each photographer.',
  steps:[
   { title:'Open Upload / Reorder', img:'gs-upload.png',
     body:'From the menu on the right, open <b>Upload / Reorder</b>, then pick the <b>session</b> and a <b>category</b> at the top.' },
   { title:'Drop in your photos',
     body:'Drag <b>JPG / PNG</b> files onto the drop zone (or click it to browse). Each photo is sorted into <b>Landscape</b> or <b>Portrait</b> automatically by its shape, under the category you picked.' },
   { title:'Set the viewing order',
     body:'Drag the thumbnails to arrange them within each orientation — this is the order the judges will see. On a phone or tablet, drag by the <b>⠿</b> grip on each photo.' },
   { title:'Randomize the order (optional)',
     body:'For unbiased judging you can shuffle the photos: <b>🔀 Randomize this category</b> reshuffles the current category, or <b>🔀 Randomize whole session</b> reshuffles every category at once. Switch on <b>Random order on upload</b> to have newly added photos drop into <b>random positions</b> instead of going on the end (remembered on this device). To keep one photographer’s photos from sitting next to each other, turn on <b>Spread photographers when randomizing</b> on the <b>⚙️ Settings</b> page.' },
   { title:'Note the photographers',
     body:'Type a <b>photographer</b> name under each photo. It shows on the Scoring page and is pre-filled into the score sheet.' },
   { title:'Fill names & titles from photo metadata (optional)',
     body:'Photo Judge can read a photo’s embedded <b>artist / author</b> as the photographer and its embedded <b>title</b> as the on-screen name, filling those in automatically as you upload. Turn it on in two places: set <code>importMetadata=true</code> in <code>photo-judge.properties</code> (then restart), and on the <b>⚙️ Settings</b> page switch on the two <b>Read metadata</b> toggles — one for the <b>photographer</b>, one for the <b>title</b> — whichever you want. The properties file is the master switch: if <code>importMetadata</code> is <code>false</code> there it wins, and those toggles are greyed out. Anything a photo doesn’t carry just falls back to the filename, and you can still edit it by hand afterward.' },
   { title:'Remove a photo',
     body:'The <b>✕</b> on a photo moves it to <code>photos\\_deleted</code> — recoverable on disk, not gone for good.' },
  ],
  note:'Photos belong to the selected session and category; switch either at the top to manage a different group. They’re only shown to judges when you Load that category onto a screen, so you can add them well ahead of the night.'
 },
 {
  id:'member-entries', icon:'📲', title:'Member entries',
  intro:'Let competitors add their own photos at the last minute from their phones. You show a QR code on a screen; they scan it, enter their name, and upload — then you approve each entry (or have them added automatically).',
  steps:[
   { title:'Turn on member entries', img:'entry-settings.png',
     body:'On the <b>⚙️ Settings</b> page, switch on <b>Enable member entries</b>. While you’re there you can set the optional <b>limits</b> (total per competitor, and per category — leave a box <b>Unlimited</b> for no cap), the <b>Wi-Fi</b> name and password to show competitors (leave blank to use the host computer’s current Wi-Fi automatically), and whether to <b>require approval</b> (see step 5).' },
   { title:'Select the session to collect into',
     body:'On the console, pick the session in the <b>Session</b> menu. Entries lock to whichever session is selected at the moment you open the form (next step), and keep going to it even if you change the menu afterward.' },
   { title:'Show the entry QR on a screen', img:'entry-screen.png',
     body:'On a screen’s row, set its <b>Type</b> dropdown to <b>Entry QR</b>. That monitor then shows how to join the Wi-Fi plus a QR code (and web address) for the entry page, and the form opens for the selected session. Devices need <b>LAN access</b> turned on to connect — see <b>Enable LAN access</b>.' },
   { title:'What competitors do', img:'entry-page.png',
     body:'A competitor joins the shown <b>Wi-Fi</b>, scans the QR (or types the address), enters their <b>first and last name</b>, then adds entries — each is one photo with a <b>category</b> and a <b>title</b>. They see their submissions with a live status (Awaiting review / Accepted / Rejected) and can edit, replace, or remove one until it’s accepted.' },
   { title:'Review the entries', img:'entry-review.png',
     body:'Click <b>🛂 Review entries</b> on the console (the badge shows how many are waiting). For each one you see the photo, competitor and category — click <b>Approve</b> to sort it into the right category and orientation (then reorder it like any photo), or <b>Reject</b>. If you turned <b>Require approval</b> off in Settings, submissions are added straight into the session and skip this step.' },
   { title:'Close the form when you’re done',
     body:'Click <b>Close Entry Form</b> on the screen’s row to stop accepting entries. You can reopen it later, or switch the screen’s Type back to <b>Slideshow</b> to present photos on that monitor again.' },
  ],
  note:'Limits count every photo by a photographer’s name for the whole session — including ones you added yourself — so the same name can’t go over by using another device. The <b>Enable member entries</b> switch turns the whole feature off at once.'
 },
 {
  id:'scoring', icon:'🏆', title:'Score keeping',
  intro:'Record a score for each photo while the operator runs the show — on the same computer, or on a second device over the network. <b>Tip:</b> for a guided, mistake-proof night where the show and the scoring are tied together, see <b>Guided presentation</b> (Score Keeper mode) and <b>Judging mode</b>. This page is the free-form scorekeeper.',
  steps:[
   { title:'Open the Scoring page',
     body:'From the menu on the right, open <b>🏆 Scoring</b>. To keep score on a separate device while someone else presents, open the app’s address on that device instead (see <b>Enable LAN access</b>).' },
   { title:'Follow a screen', img:'score-keeping-1-on-screen.png',
     body:'Pick a <b>screen</b> at the top. The page shows the photos from whatever that screen currently has loaded (session / category / orientation). The panel on the right shows which photo the operator is presenting; when you’re viewing the same one it turns green, and <b>Jump to operator’s photo</b> snaps you to it.' },
   { title:'Move at your own pace (optional)',
     body:'Use <b>Prev</b> / <b>Next</b> (or the ← / → arrow keys) to move through the photos yourself — this does <b>not</b> change what the judges see, so you can score ahead of or behind the operator. (If <b>Lock the scorekeeper</b> is turned on in Settings, the page stays pinned to the operator’s photo.)' },
   { title:'Enter a score',
     body:'Type a score in the box and press <kbd>Enter</kbd> to save it for that photo; clear the box and press <kbd>Enter</kbd> to remove it. Scores show as a green badge on the Upload / Reorder page and are pre-filled into the score-sheet PDF.' },
   { title:'Keeping score during a guided presentation', img:'score-separate.png',
     body:'When the operator runs a <b>presentation mode</b> from the Console (see <b>Guided presentation</b>), scoring moves there by default and this page just shows a short notice. To split the jobs — one person drives, another scores — turn on <b>Use a separate scorekeeper screen</b> on the <b>⚙️ Settings</b> page. This page then <b>follows the live photo automatically</b> (you can’t flip ahead) and you score each photo as it’s presented; in <b>Judge scoring</b> mode it shows the live <b>judge board</b> instead. Either way, once the operator <b>Ends</b> the session the scores lock.' },
   { title:'Score physical prints', img:'score-keeping-2-physical-prints.png',
     body:'For printed entries with no uploaded photo, click <b>📋 Physical prints</b> at the top. Pick the session and category, then fill the table — <b>Print title</b>, <b>Photographer</b>, <b>Score</b>. A fresh row appears as you start the last one; <kbd>Tab</kbd> moves across fields and <kbd>Enter</kbd> drops to the next row. Each entry saves on its own; the <b>×</b> removes a row. (Physical prints work the same whether or not a presentation mode is on.)' },
   { title:'Print the score sheet',
     body:'On the console, click <b>⤓ Score sheet</b> to download a printable PDF of the session — every category’s photos (and any physical prints) with the scores filled in.' },
  ]
 },
 {
  id:'presenting', icon:'🎬', title:'Guided presentation',
  intro:'For a scoring night you can run the whole show from the <b>Operator Console</b> instead of driving each screen by hand. Turn on a presentation mode, and a single <b>Prev / Next</b> steps the live photo across your monitors and categories — with scoring built right in where you present. (This replaces the old solo-operator mode.)',
  steps:[
   { title:'Pick a presentation mode', img:'present-settings.png',
     body:'On the <b>⚙️ Settings</b> page (Scoring card) turn on one of three modes: <b>Guided presentation</b> (a guided slideshow, no scoring), <b>Score Keeper mode</b> (guided slideshow + a score box on the Console), or <b>Judge scoring</b> (judges score from their phones — see <b>Judging mode</b>). They all share the same console-driven flow below. Score Keeper and Judge scoring can’t both be on at once.' },
   { title:'Create your screens',
     body:'On the console, create the screens you’ll present on — typically one for the <b>landscape</b> monitor and one for the <b>portrait</b> monitor — and open each one’s output window (see <b>Getting started</b>). One monitor is fine: use the same screen for both orientations.' },
   { title:'Choose the screens (Presentation card)', img:'present-card.png',
     body:'Open <b>🗂️ Session Management</b>, pick your session, and in the <b>Presentation</b> card choose which screen presents <b>Landscape</b> and which presents <b>Portrait</b>, which orientation to <b>show first</b>, and — under <b>When it ends</b> — what happens after the last category (wait on a “complete” screen, loop, or black out). Click <b>Save presentation</b>.' },
   { title:'Start the session', img:'present-start.png',
     body:'Back on the Console a <b>Start / Pause / End</b> bar appears. Until you click <b>▶ Start</b> the monitors stay <b>black</b> and the per-screen <b>Prev/Next/Black/Make live</b> buttons are locked — so you can set screens up without anything showing by accident. Click <b>Start</b>: the first title card appears on its monitor and a <b>presentation panel</b> opens below the screens table.' },
   { title:'Drive the show', img:'present-panel.png',
     body:'In the panel, <b>◀ Prev</b> / <b>Next ▶</b> step the live photo: title card → each photo → end card. At the end of a category’s orientation it switches to the other orientation’s monitor automatically (the idle one goes black) and moves on to the next category in your <b>Active</b> order. The panel always mirrors what’s live.' },
   { title:'Score as you go (Score Keeper mode)', img:'score-separate.png',
     body:'In Score Keeper mode the panel includes a <b>score box</b> for the live photo — type a score and press <kbd>Enter</kbd> (the 🏆 winner flag appears at the session’s threshold). Want a second person to keep score on their own screen? Turn on <b>Use a separate scorekeeper screen</b> in Settings — then you just drive here while they score on the <b>🏆 Scoring</b> page, which follows the live photo automatically (see <b>Score keeping</b>).' },
   { title:'Pause to reconfigure',
     body:'Click <b>⏸ Pause</b> to suspend the run — the panel stops driving and the per-screen controls unlock so you can reload a category or fix a screen — then <b>▶ Resume</b> to carry on. Nothing is locked while paused.' },
   { title:'End and lock the scores', img:'present-ended.png',
     body:'When you reach the last photo the Console <b>asks if you want to end</b> the session. Ending (or the <b>■ End</b> button at any time) blacks the monitors and <b>locks the scores</b> so they can’t be edited afterward. Ended sessions show <b>✓ judged</b> in the session dropdowns, and their start/end times appear on the Presentation card.' },
   { title:'Redo a night if needed',
     body:'Need to start over? <b>↻ Restart</b> (while running, or “re-open” after End) clears the start/end stamps and <b>erases all of that session’s scores</b> after a warning, then begins a fresh run. Use it only when you truly want to judge the night again from scratch.' },
  ],
  note:'The Presentation screens and options are saved with the session, and a new session inherits them. While a presentation mode is on, the show is always driven from the Console — the old “drive it from the Scoring page” flow is gone.'
 },
 {
  id:'judging-mode', icon:'⚖️', title:'Judging mode',
  intro:'Let the judges score from their own phones instead of a scorekeeper typing the numbers. Each judge scans a QR code, enters their name, and submits a score for the live photo; the app combines their scores into each photo’s score while you drive the show from the Console. It builds on <b>Guided presentation</b>, so read that first.',
  steps:[
   { title:'Turn on Judge scoring', img:'present-settings.png',
     body:'On the <b>⚙️ Settings</b> page (Scoring card) switch on <b>Judge scoring</b>. (It can’t be on at the same time as Score Keeper mode.) While it’s on, the show is driven from the Console and only one monitor is live at a time.' },
   { title:'Set the judging rules', img:'judge-rules.png',
     body:'Open <b>🗂️ Session Management</b>, pick your session, and fill in the <b>Judge mode</b> card: how to <b>combine scores</b> (average or total), how many <b>judges are needed</b>, the <b>score range</b> and step, plus options for an <b>alternate judge</b>, <b>auto-deferring a judge’s own photo</b>, keeping judges <b>anonymous</b>, and whether to <b>show the photographer</b> to judges. <b>Judges needed</b> and a <b>score range</b> are required before you can start.' },
   { title:'Set the Presentation screens', img:'present-card.png',
     body:'In the same page’s <b>Presentation</b> card, choose which screen shows Landscape and which shows Portrait (plus show-first / when-it-ends), exactly as in <b>Guided presentation</b>.' },
   { title:'Show the Judge QR',
     body:'On the console, set a screen’s <b>Type</b> to <b>Judge QR</b>. That monitor shows the Wi-Fi details and a QR code; each judge joins the Wi-Fi and scans it (devices need <b>LAN access</b> — see <b>Enable LAN access</b>), enters their first and last name, and ticks whether they’re the <b>alternate</b>.' },
   { title:'Wait for the judges, then Start',
     body:'The Console’s lifecycle bar shows how many judges have <b>joined</b>. <b>▶ Start judging</b> stays disabled until the rules are set and all needed judges have connected; clicking it shows a confirmation of the rules. Until you start, the monitors stay black and nobody can score.' },
   { title:'Run the show', img:'judge-board.png',
     body:'Drive with the panel’s <b>Prev / Next</b> just like Guided presentation. As each photo goes live the judges score it on their phones, and the panel shows the <b>judge board</b> — every judge’s score, the <b>combined</b> value, and an <b>N / needed</b> progress count. Want the board on a separate screen for a scorekeeper to watch? Turn on <b>Use a separate scorekeeper screen</b> in Settings.' },
   { title:'Handle a judge’s own photo',
     body:'If a photo is by one of the judges, that judge taps <b>defer</b> on their phone and the <b>alternate</b> scores it instead (turn on <b>auto-defer</b> to do this automatically by matching the photographer’s name). From the board you can also press <b>Rescore</b> for one judge — or ask <b>all</b> judges to re-score — if something needs a do-over.' },
   { title:'End and lock', img:'present-ended.png',
     body:'When the show reaches the last photo the Console asks if you want to <b>End</b> and lock the scores (or press <b>■ End</b> any time). Ended sessions show <b>✓ judged</b> in the dropdowns. To judge the night again, use <b>↻ Restart</b> — it erases the scores after a warning.' },
  ],
  note:'Each judge’s score is combined into the photo’s score automatically, so the score sheet, winner badges and statistics all work the same as hand-entered scores. The judging rules are saved with the session and inherited by new sessions.'
 },
 {
  id:'importing-exporting', icon:'⇄', title:'Importing & exporting',
  intro:'Move whole sessions — photos and all — between computers as portable files. Open the wizard with <b>⇄ Import / Export</b> on the console.',
  steps:[
   { title:'About the files',
     body:'Sessions travel as <b>.pjs</b> (one session) or <b>.pjss</b> (several) files. Both are compressed bundles that include the photos, titles, photographers, scores, physical prints and — for archived nights — the archive record. Nothing is re-encoded, so photos keep their exact quality.' },
   { title:'Export — pick sessions', img:'io-export.png',
     body:'On the <b>Export</b> tab you’ll see every session, live and archived. Narrow the list with the filters (active/archived, photographer, photo title, date range) and click a column heading to sort. Click <b>Add →</b> on each session you want to send — they collect in the <b>Selected for export</b> basket. (Or use a row’s <b>⤓ .pjs</b> to export just that one right away.)' },
   { title:'Export — download',
     body:'Click <b>Export</b>. One session downloads as a <b>.pjs</b>, several as a <b>.pjss</b>, with a progress bar for large bundles. Copy that file to a USB stick, cloud drive, or email.' },
   { title:'Import — choose files',

const rail = document.getElementById('rail');
const pane = document.getElementById('pane');

GUIDES.forEach(g => {
  const t = document.createElement('button');
  t.className = 'tab'; t.dataset.id = g.id;
  t.innerHTML = '<span class="ic">' + g.icon + '</span><span class="lbl"></span>' + (g.soon ? '<span class="soon">soon</span>' : '');
  t.querySelector('.lbl').textContent = g.title;
  t.onclick = () => show(g.id);
  rail.appendChild(t);
});

function show(id){
  const g = GUIDES.find(x => x.id === id) || GUIDES[0];
  rail.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.id === g.id));
  let html = '<h1></h1><div class="intro"></div>';
  if(g.comingSoon) html += '<div class="banner soon"></div>';
  if(g.warn) html += '<div class="banner warn"></div>';
  pane.innerHTML = html;
  pane.querySelector('h1').textContent = g.title;
  pane.querySelector('.intro').innerHTML = g.intro;
  if(g.comingSoon) pane.querySelector('.banner.soon').textContent = g.comingSoon;
  if(g.warn) pane.querySelector('.banner.warn').innerHTML = '⚠️  ' + g.warn;

  g.steps.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'step';
    el.innerHTML =
      '<div class="head"><div class="num">' + (i+1) + '</div><h2></h2></div>' +
      '<div class="body"></div>' +
      (s.img ? '<a class="shot" target="_blank"><img loading="lazy"><div class="cap">Click to enlarge</div></a>' : '');
    el.querySelector('h2').textContent = s.title;
    el.querySelector('.body').innerHTML = s.body;
    if(s.img){
      const url = IMG + encodeURIComponent(s.img);
      el.querySelector('.shot').href = url;
      const img = el.querySelector('img'); img.src = url; img.alt = s.title;
    }
    pane.appendChild(el);
  });
  if(g.note){ const n = document.createElement('div'); n.className = 'note'; n.innerHTML = g.note; pane.appendChild(n); }

  if(location.hash.slice(1) !== g.id) history.replaceState(null, '', '#' + g.id);
  pane.scrollIntoView ? window.scrollTo(0, 0) : null;
}

const start = GUIDES.find(g => g.id === location.hash.slice(1));
show(start ? start.id : GUIDES[0].id);
window.addEventListener('hashchange', () => { const g = GUIDES.find(x => x.id === location.hash.slice(1)); if(g) show(g.id); });
</script>
