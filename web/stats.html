<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Judge — Statistics</title>
<style>
 body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#1b1d21;color:#e8e8e8}
 header{background:#111;padding:10px 16px;font-weight:600;font-size:15px}
 .intro{color:#8a9099;font-size:13px;padding:10px 16px 0;line-height:1.5}
 .bar{padding:12px 16px;display:flex;gap:10px 14px;align-items:flex-end;flex-wrap:wrap;border-bottom:1px solid #333}
 .f{display:flex;flex-direction:column;gap:4px}
 .f label{color:#9aa0a6;font-size:12px}
 input,button{font-size:14px;padding:8px 10px;background:#2a2d33;color:#eee;border:1px solid #444;border-radius:5px;box-sizing:border-box;max-width:100%}
 button{cursor:pointer}
 button:hover{background:#363a42}
 .presets{display:flex;gap:6px;flex-wrap:wrap}
 .presets button.active{background:#2d6cdf;border-color:#2d6cdf}
 #content{padding:14px 16px 48px}
 .empty{color:#777;font-size:14px;padding:28px 0}
 .rangelabel{color:#9aa0a6;font-size:13px;margin:0 0 12px}
 .cards{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}
 .stat{background:#23262c;border:1px solid #3a3e45;border-radius:8px;padding:14px 18px;min-width:130px;flex:1 1 130px}
 .stat .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
 .stat .l{color:#9aa0a6;font-size:12.5px;margin-top:4px;text-transform:uppercase;letter-spacing:.03em}
 .legend{display:flex;gap:12px 16px;flex-wrap:wrap;margin:2px 0 14px}
 .legend .li{display:flex;align-items:center;gap:6px;font-size:13px;color:#c9ccd1}
 .legend .sw{width:13px;height:13px;border-radius:3px;flex:none}
 .chart{background:#23262c;border:1px solid #3a3e45;border-radius:8px;margin:0 0 16px;overflow:hidden}
 .chart h3{margin:0;padding:13px 16px 4px;font-size:14px;font-weight:600}
 .chart .desc{color:#8a9099;font-size:12.5px;padding:0 16px 8px}
 .scroll{overflow-x:auto;padding:4px 16px 14px}
 .chart-svg{display:block}
 .chart-svg .grid{stroke:#33373e;stroke-width:1}
 .chart-svg .yl{fill:#8a9099;font-size:11px;text-anchor:end;font-family:system-ui}
 .chart-svg .xl{fill:#aeb4bb;font-size:11px;text-anchor:end;font-family:system-ui}
 .chart-svg .xs{font-size:10px}
 .chart-svg .xc{text-anchor:middle;fill:#cdd2da;font-size:11.5px;font-weight:600}
 .chart-svg rect{transition:opacity .1s}
 .tablewrap{margin:0 0 18px}
 .tablewrap h3{font-size:14px;font-weight:600;margin:0 0 8px}
 .tcard{background:#23262c;border:1px solid #3a3e45;border-radius:8px;overflow-x:auto}
 table{width:100%;border-collapse:collapse;font-size:13px}
 th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #2c2f35;white-space:nowrap}
 th{color:#9aa0a6;font-weight:500;background:#23262c}
 td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
 tfoot td{font-weight:600;border-top:2px solid #3a3e45;border-bottom:none}
 .sw-inline{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
 .muted{color:#8a9099}
 @media (max-width:760px){
   input,button{font-size:16px}
   .f{flex:1 1 140px}
 }
</style>
</head>
<body>
<header>Photo Judge — Statistics</header>
<div class="intro">Entry counts across your competition history, including archived sessions. An entry is any photo in a session — operator-uploaded or member-submitted. Pick a time frame to see totals, a per-session and per-category breakdown, and who entered the most.</div>
<div class="bar">
  <div class="f"><label>Quick range</label>
    <div class="presets">
      <button data-preset="all">All time</button>
      <button data-preset="ytd">This year</button>
      <button data-preset="12m">Last 12 months</button>
    </div>
  </div>
  <div class="f"><label>From</label><input type="date" id="from"></div>
  <div class="f"><label>To</label><input type="date" id="to"></div>
  <button id="apply">Apply</button>
</div>
<div id="content"><div class="empty">Loading…</div></div>

<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Distinct, reasonably colour-blind-friendly palette. Categories are coloured by
// their index in data.categories, so the same category keeps its colour across
// every chart and the legend.
const PALETTE = ['#2d6cdf','#e0683b','#33b07a','#c9a23b','#9b59b6','#e05b8a',
                 '#3bb6c9','#8a9a3b','#d4564f','#5f6caf','#b07a4a','#46a0c4'];
let CATS = [];
const colorFor = c => { const i = CATS.indexOf(c); return PALETTE[(i < 0 ? 0 : i) % PALETTE.length]; };
const catVal = (s, c) => { const e = (s.byCategory || []).find(x => x.category === c); return e ? e.count : 0; };
const phCatVal = (p, c) => { const e = (p.byCategory || []).find(x => x.category === c); return e ? e.count : 0; };
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

function isoLocal(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }

// Round a value up to a "nice" axis maximum (1,2,2.5,5,10 × 10ⁿ).
function niceCeil(v){
 if(v <= 0) return 1;
 const p = Math.pow(10, Math.floor(Math.log10(v)));
 const n = v / p;
 const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
 return m * p;
}

const GEO = {padL:44, padR:14, padT:14, padB:62, plotH:240};

function axisSvg(plotW, nm){
 const {padL, padT, plotH} = GEO;
 let g = '';
 for(let t = 0; t <= 4; t++){
   const val = nm * t / 4;
   const yy = padT + plotH - (val / nm) * plotH;
   g += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${(padL+plotW).toFixed(1)}" y2="${yy.toFixed(1)}" class="grid"/>`;
   g += `<text x="${padL-7}" y="${(yy+4).toFixed(1)}" class="yl">${Math.round(val)}</text>`;
 }
 return g;
}
function rect(x, y, w, h, fill, opacity, title){
 if(h <= 0) return '';
 return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}"`
      + (opacity != null ? ` opacity="${opacity}"` : '') + ` rx="2">`
      + (title ? `<title>${esc(title)}</title>` : '') + `</rect>`;
}
function xlabel(cx, text, full){
 const {padT, plotH} = GEO, y = padT + plotH + 14;
 return `<text x="${cx.toFixed(1)}" y="${y}" class="xl" transform="rotate(38 ${cx.toFixed(1)} ${y})">`
      + esc(text) + (full ? `<title>${esc(full)}</title>` : '') + `</text>`;
}
function wrapSvg(W, H, inner){
 return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="chart-svg">${inner}</svg></div>`;
}
const shortDate = d => (d || '').slice(5); // MM-DD

// Chart 1 — custom overlaid: a faint full-height bar = session total, with the
// session's category counts drawn as side-by-side bars in front of it.
function chartOverlaid(sess){
 if(!sess.length) return '';
 const {padL, padR, padT, padB, plotH} = GEO;
 const groupW = 96, plotW = sess.length * groupW, W = padL + plotW + padR, H = padT + plotH + padB;
 const nm = niceCeil(Math.max(...sess.map(s => s.total)));
 const yOf = v => padT + plotH - (v / nm) * plotH;
 const base = padT + plotH;
 let g = axisSvg(plotW, nm);
 sess.forEach((s, i) => {
   const gx = padL + i * groupW, inner = groupW - 22, x0 = gx + 11;
   g += rect(x0, yOf(s.total), inner, base - yOf(s.total), '#475066', 0.5, `${s.date} · total ${s.total}`);
   const present = CATS.filter(c => catVal(s, c) > 0);
   const bw = inner / Math.max(present.length, 1);
   present.forEach((c, j) => {
     const v = catVal(s, c);
     g += rect(x0 + j*bw + 1, yOf(v), Math.max(bw - 2, 1.5), base - yOf(v), colorFor(c), null, `${s.date} · ${c}: ${v}`);
   });
   g += xlabel(gx + groupW/2, shortDate(s.date), s.date + (s.description ? ' · ' + s.description : ''));
 });
 return wrapSvg(W, H, g);
}

// Chart 2 — stacked: one bar per session, category segments stacked to the total.
function chartStacked(sess){
 if(!sess.length) return '';
 const {padL, padR, padT, padB, plotH} = GEO;
 const groupW = 84, plotW = sess.length * groupW, W = padL + plotW + padR, H = padT + plotH + padB;
 const nm = niceCeil(Math.max(...sess.map(s => s.total)));
 const yOf = v => padT + plotH - (v / nm) * plotH;
 let g = axisSvg(plotW, nm);
 sess.forEach((s, i) => {
   const bw = Math.min(groupW - 16, 48), gx = padL + i * groupW, x0 = gx + (groupW - bw) / 2;
   let acc = 0;
   CATS.forEach(c => {
     const v = catVal(s, c);
     if(v <= 0) return;
     g += rect(x0, yOf(acc + v), bw, yOf(acc) - yOf(acc + v), colorFor(c), null, `${s.date} · ${c}: ${v}`);
     acc += v;
   });
   g += xlabel(gx + groupW/2, shortDate(s.date), s.date + (s.description ? ' · ' + s.description : ''));
 });
 return wrapSvg(W, H, g);
}

// Chart 3 — category totals across the whole range.
function chartCategories(byCat){
 if(!byCat.length) return '';
 const {padL, padR, padT, padB, plotH} = GEO;
 const groupW = 104, plotW = byCat.length * groupW, W = padL + plotW + padR, H = padT + plotH + padB;
 const nm = niceCeil(Math.max(...byCat.map(c => c.count)));
 const yOf = v => padT + plotH - (v / nm) * plotH;
 const base = padT + plotH;
 let g = axisSvg(plotW, nm);
 byCat.forEach((c, i) => {
   const bw = Math.min(groupW - 22, 58), gx = padL + i * groupW, x0 = gx + (groupW - bw) / 2;
   g += rect(x0, yOf(c.count), bw, base - yOf(c.count), colorFor(c.category), null, `${c.category}: ${c.count}`);
   g += xlabel(gx + groupW/2, c.category, `${c.category}: ${c.count}`);
 });
 return wrapSvg(W, H, g);
}

// Chart 4 — photographer clusters: one cluster per session, one bar per photographer
// within it, each bar stacked by category. Shows who entered the most each session and
// their category mix. Photographer labelled under each bar; session date under the cluster.
function chartPhotographerStacks(sess){
 const rows = sess.filter(s => (s.byPhotographer || []).length);
 if(!rows.length) return '';
 const {padL, padR, padT, plotH} = GEO;
 const padB = 98, bw = 18, innerGap = 6, clusterGap = 30, base = padT + plotH;
 let maxv = 1;
 rows.forEach(s => s.byPhotographer.forEach(p => { if(p.count > maxv) maxv = p.count; }));
 const nm = niceCeil(maxv);
 const yOf = v => padT + plotH - (v / nm) * plotH;
 let cursor = padL;
 const clusters = rows.map(s => {
   const n = s.byPhotographer.length, w = n * bw + (n - 1) * innerGap;
   const c = { s, x: cursor, w }; cursor += w + clusterGap; return c;
 });
 const plotW = Math.max(cursor - clusterGap - padL, 1), W = padL + plotW + padR, H = padT + plotH + padB;
 let g = axisSvg(plotW, nm);
 clusters.forEach(c => {
   c.s.byPhotographer.forEach((p, j) => {
     const x0 = c.x + j * (bw + innerGap);
     let acc = 0;
     CATS.forEach(cat => {
       const v = phCatVal(p, cat);
       if(v <= 0) return;
       g += rect(x0, yOf(acc + v), bw, yOf(acc) - yOf(acc + v), colorFor(cat), null, `${c.s.date} · ${p.name} · ${cat}: ${v}`);
       acc += v;
     });
     const cx = x0 + bw / 2, ly = base + 13;
     g += `<text x="${cx.toFixed(1)}" y="${ly}" class="xl xs" transform="rotate(40 ${cx.toFixed(1)} ${ly})">`
        + esc(trunc(p.name, 12)) + `<title>${esc(p.name)} · ${p.count}</title></text>`;
   });
   g += `<text x="${(c.x + c.w / 2).toFixed(1)}" y="${base + padB - 8}" class="xl xc">${esc(c.s.date)}</text>`;
 });
 return wrapSvg(W, H, g);
}

function legend(){
 if(!CATS.length) return '';
 return '<div class="legend">' + CATS.map(c =>
   `<span class="li"><span class="sw" style="background:${colorFor(c)}"></span>${esc(c)}</span>`).join('') + '</div>';
}

function sessionTable(sess){
 if(!sess.length) return '';
 const heads = ['<th>Session</th>', '<th class="n">Total</th>'].concat(CATS.map(c =>
   `<th class="n"><span class="sw-inline" style="background:${colorFor(c)}"></span>${esc(c)}</th>`));
 const rows = sess.map(s => {
   const label = esc(s.date) + (s.description ? ` <span class="muted">· ${esc(s.description)}</span>` : '');
   const cells = CATS.map(c => { const v = catVal(s, c); return `<td class="n">${v || '<span class="muted">–</span>'}</td>`; });
   return `<tr><td>${label}</td><td class="n">${s.total}</td>${cells.join('')}</tr>`;
 });
 const foot = '<tfoot><tr><td>All sessions</td><td class="n">'
   + sess.reduce((a,s)=>a+s.total,0) + '</td>'
   + CATS.map(c => `<td class="n">${sess.reduce((a,s)=>a+catVal(s,c),0)}</td>`).join('') + '</tr></tfoot>';
 return '<div class="tablewrap"><h3>Entries by session</h3><div class="tcard"><table><thead><tr>'
   + heads.join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody>' + foot + '</table></div></div>';
}

function categoryTable(byCat, grand){
 if(!byCat.length) return '';
 const rows = byCat.map(c => {
   const pct = grand ? (100 * c.count / grand) : 0;
   return `<tr><td><span class="sw-inline" style="background:${colorFor(c.category)}"></span>${esc(c.category)}</td>`
     + `<td class="n">${c.count}</td><td class="n">${pct.toFixed(1)}%</td></tr>`;
 });
 return '<div class="tablewrap"><h3>Entries by category</h3><div class="tcard"><table>'
   + '<thead><tr><th>Category</th><th class="n">Entries</th><th class="n">Share</th></tr></thead>'
   + '<tbody>' + rows.join('') + '</tbody>'
   + `<tfoot><tr><td>Total</td><td class="n">${grand}</td><td class="n">100%</td></tr></tfoot>`
   + '</table></div></div>';
}

function photographerTable(byPh){
 if(!byPh.length) return '';
 const rows = byPh.map(p => {
   const breakdown = (p.byCategory || []).map(c =>
     `<span class="sw-inline" style="background:${colorFor(c.category)}"></span>${esc(c.category)} ${c.count}`).join('&nbsp;&nbsp; ') || '<span class="muted">–</span>';
   return `<tr><td>${esc(p.name)}</td><td class="n">${p.count}</td><td>${breakdown}</td></tr>`;
 });
 return '<div class="tablewrap"><h3>Entries by photographer</h3><div class="tcard"><table>'
   + '<thead><tr><th>Photographer</th><th class="n">Entries</th><th>By category</th></tr></thead>'
   + '<tbody>' + rows.join('') + '</tbody></table></div></div>';
}

function rangeLabel(d){
 if(!d.from && !d.to) return 'All time';
 if(d.from && d.to) return d.from + ' to ' + d.to;
 if(d.from) return 'Since ' + d.from;
 return 'Up to ' + d.to;
}

function render(d){
 CATS = d.categories || [];
 const t = d.totals || {};
 if(!t.entries){
   $('content').innerHTML = '<div class="rangelabel">Time frame: ' + esc(rangeLabel(d)) + '</div>'
     + '<div class="empty">No entries in this time frame. Add photos to a session, or widen the range.</div>';
   return;
 }
 const cards = [
   ['Entries', t.entries], ['Sessions', t.sessions],
   ['Categories', t.categories], ['Photographers', t.photographers],
 ].map(([l,n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

 const out = [];
 out.push('<div class="rangelabel">Time frame: ' + esc(rangeLabel(d)) + '</div>');
 out.push('<div class="cards">' + cards + '</div>');
 out.push(legend());
 out.push('<div class="chart"><h3>Total &amp; category entries per session</h3>'
   + '<div class="desc">Faint bar = the session total; the coloured bars in front are that session\'s categories, side by side.</div>'
   + chartOverlaid(d.bySession) + '</div>');
 out.push('<div class="chart"><h3>Category mix per session (stacked)</h3>'
   + '<div class="desc">Each bar is a session; segments stack to the session total.</div>'
   + chartStacked(d.bySession) + '</div>');
 out.push('<div class="chart"><h3>Entries by category</h3>'
   + '<div class="desc">Totals across the whole time frame.</div>'
   + chartCategories(d.byCategory) + '</div>');
 out.push('<div class="chart"><h3>Entries by photographer per session</h3>'
   + '<div class="desc">Each cluster is a session; each bar a photographer, stacked by category.</div>'
   + chartPhotographerStacks(d.bySession) + '</div>');
 out.push(sessionTable(d.bySession));
 out.push(categoryTable(d.byCategory, t.entries));
 out.push(photographerTable(d.byPhotographer));
 $('content').innerHTML = out.join('');
}

async function load(){
 const p = new URLSearchParams();
 if($('from').value) p.set('from', $('from').value);
 if($('to').value)   p.set('to', $('to').value);
 $('content').innerHTML = '<div class="empty">Loading…</div>';
 try {
   const r = await fetch('/api/stats?' + p.toString());
   if(!r.ok) throw new Error(await r.text());
   render(await r.json());
 } catch(e){
   $('content').innerHTML = '<div class="empty">Could not load statistics. ' + esc(e.message || '') + '</div>';
 }
}

function setActive(preset){
 document.querySelectorAll('.presets button').forEach(b =>
   b.classList.toggle('active', b.dataset.preset === preset));
}
document.querySelectorAll('.presets button').forEach(b => b.onclick = () => {
 const today = new Date();
 if(b.dataset.preset === 'all'){ $('from').value = ''; $('to').value = ''; }
 else if(b.dataset.preset === 'ytd'){
   $('from').value = today.getFullYear() + '-01-01';
   $('to').value = isoLocal(today);
 } else { // 12m
   const back = new Date(today); back.setFullYear(back.getFullYear() - 1);
   $('from').value = isoLocal(back);
   $('to').value = isoLocal(today);
 }
 setActive(b.dataset.preset);
 load();
});
$('apply').onclick = () => { setActive(''); load(); };
['from','to'].forEach(id => $(id).addEventListener('change', () => setActive('')));

setActive('all');
load();
</script>
<script src="/modal.js"></script>
<script src="/nav.js"></script>
</body>
</html>
